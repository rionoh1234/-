l_english:
 # ─────────────── 문화·학문·민간 ───────────────
 jfp_culture.1.t:0 "여유당의 별이 지다"
 jfp_culture.1.d:0 "강진 유배에서 풀려나 고향 마재에 머물던 다산 정약용이 세상을 떠났다. 그가 남긴 오백여 권의 저술에는 토지 제도부터 지방 행정, 형법, 의학에 이르는 개혁안이 담겨 있다."
 jfp_culture.1.f:0 "“백성을 위해 목민관이 있는 것이지, 목민관을 위해 백성이 있는 것이 아니다.”\n\n— 정약용, 「원목(原牧)」의 뜻을 풀어"
 jfp_culture.1.a:0 "그의 유고를 정리하여 후학에게 전하게 하라."
 jfp_culture.1.b:0 "천주교와 얽혔던 죄인이다. 조용히 장례를 치르게 하라."

 jfp_culture.2.t:0 "기(氣)를 재다"
 jfp_culture.2.d:0 "개성 출신의 학자 최한기가 세상의 모든 이치를 경험과 측정으로 탐구해야 한다는 저술을 내놓았다. 그는 서양의 과학 서적을 사 모으느라 가산을 탕진했다고 한다."
 jfp_culture.2.f:0 "서재는 책으로 발 디딜 틈이 없었다. 손님이 책값 걱정을 하자 최한기는 웃었다. “이 책 속의 사람들을 만나러 천 리를 가려면 그보다 더 들 것이오.”"
 jfp_culture.2.a:0 "새로운 학문을 장려하라."
 jfp_culture.2.b:0 "성리학의 본령에서 벗어난 잡학이다."

 jfp_culture.3.t:0 "연경에서 온 흉보"
 jfp_culture.3.d:0 "북경에 다녀온 사신단이 놀라운 소식을 전했다. 대국 청나라가 영국과의 전쟁에서 거듭 패하여 홍콩을 내주고 항구를 열었다는 것이다. 바다 건너 오랑캐의 힘이 이토록 강할 줄은 아무도 몰랐다."
 jfp_culture.3.f:0 "“천조(天朝)가 섬나라 오랑캐에게 무릎을 꿇었다니, 이게 참말이오?”\n\n“참말이오. 그 배는 바람이 없어도 간다 하더이다.”"
 jfp_culture.3.a:0 "남의 일이 아니다. 해안 경비를 강화하라."
 jfp_culture.3.b:0 "청나라의 일일 뿐이다."

 jfp_culture.4.t:0 "세한도"
 jfp_culture.4.d:0 "제주에 유배 중인 추사 김정희가 그림 한 폭을 그려 제자에게 보냈다. 권세를 잃은 스승을 변함없이 찾아 준 제자의 의리를, 추운 겨울에도 푸른 소나무와 잣나무에 빗댄 그림이다. 그의 사면을 청하는 목소리가 나오고 있다."
 jfp_culture.4.f:0 "“날이 추워진 뒤에야 소나무와 잣나무가 시들지 않음을 안다.”\n\n— 『논어』, 「세한도」 발문에서"
 jfp_culture.4.a:0 "추사를 해배하라."
 jfp_culture.4.b:0 "죄는 죄다. 유배를 풀지 않는다."

 jfp_culture.5.t:0 "제주 앞바다의 측량선"
 jfp_culture.5.d:0 "영국 군함 한 척이 제주와 남해안 일대를 돌며 멋대로 바다의 깊이를 재고 지도를 그리고 있다. 지방관이 퇴거를 요구했으나 아랑곳하지 않는다."
 jfp_culture.5.f:0 "해녀들이 물질을 멈추고 수평선을 바라보았다. 검은 배 위에서 사람들이 긴 줄을 바다에 드리웠다 걷어 올리기를 되풀이하고 있었다."
 jfp_culture.5.a:0 "엄중히 항의하고 해안 경계를 늘려라."
 jfp_culture.5.b:0 "배 한 척에 소란 떨 일은 아니다."

 jfp_culture.6.t:0 "괴질"
 jfp_culture.6.d:0 "토사곽란을 일으키며 하루 이틀 만에 사람을 죽이는 괴질이 다시 번지고 있다. 서북 지방에서 시작된 병이 한양까지 내려왔다는 소문에 민심이 흉흉하다."
 jfp_culture.6.f:0 "마을 어귀마다 고양이 그림이 붙었다. 쥐 귀신이 병을 옮긴다는 믿음 때문이었다. 의원들은 고개를 저었지만, 달리 내놓을 방도도 없었다."
 jfp_culture.6.a:0 "활인서를 열고 의원을 보내라."
 jfp_culture.6.b:0 "하늘의 뜻이다. 지나가기를 기다릴 수밖에."

 jfp_culture.7.t:0 "북경 함락"
 jfp_culture.7.d:0 "영국과 프랑스 연합군이 북경을 함락하고 황제의 이궁을 불태웠으며, 청 황제는 열하로 피신했다는 소식이 들어왔다. 한양에서는 서양 오랑캐가 곧 쳐들어온다는 소문이 돌아 피난 짐을 싸는 양반가가 속출하고 있다."
 jfp_culture.7.f:0 "남대문 밖으로 가마와 짐수레가 줄지어 빠져나갔다. 떠나는 이들을 바라보던 상인 하나가 침을 뱉었다. “난리가 나면 저 양반들이 제일 먼저 도망치지.”"
 jfp_culture.7.a:0 "민심부터 진정시켜라."
 jfp_culture.7.b:0 "해안 방비를 서둘러라."

 jfp_culture.8.t:0 "대동여지도"
 jfp_culture.8.d:0 "김정호가 수십 년에 걸쳐 완성한 전국 지도를 목판으로 새겨 펴냈다. 산줄기와 물줄기, 고을과 역참, 도로가 놀라울 만큼 정밀하게 그려져 있다. 판목으로 찍어 내니 누구나 쉽게 구할 수 있다."
 jfp_culture.8.f:0 "스물두 첩으로 나뉜 지도를 이어 붙이자 대청마루를 다 덮고도 남았다. 지켜보던 관리가 손끝으로 고향 고을을 짚어 보더니 말을 잇지 못했다."
 jfp_culture.8.a:0 "판각을 지원하고 관청에 보급하라."
 jfp_culture.8.b:0 "이토록 정밀한 지도는 군사 기밀이다. 군영에서만 쓰게 하라."

 jfp_culture.9.t:0 "여섯 마당"
 jfp_culture.9.d:0 "고창의 향리 신재효가 광대들의 판소리 사설을 정리하고, 소리꾼들을 후원하며 길러 내고 있다. 그의 집에는 전국의 명창들이 모여든다."
 jfp_culture.9.f:0 "“얼씨구!”\n\n추임새가 터지자 소리꾼의 목청이 한층 높아졌다. 사랑방 양반도, 마당의 머슴도 똑같이 무릎을 쳤다."
 jfp_culture.9.a:0 "소리꾼들을 후원하라."
 jfp_culture.9.b:0 "광대의 노래는 천한 것이다."

 jfp_culture.10.t:0 "사상의학"
 jfp_culture.10.d:0 "함흥 출신의 의원 이제마가 사람의 체질을 태양·소양·태음·소음의 넷으로 나누고, 체질에 따라 병을 다스려야 한다는 의서를 지었다."
 jfp_culture.10.f:0 "“같은 병이라도 사람이 다르면 약이 다르다.” 이제마는 환자의 얼굴과 체격을 오래도록 살핀 뒤에야 붓을 들었다."
 jfp_culture.10.a:0 "그의 의서를 널리 보급하라."
 jfp_culture.10.b:0 "검증되지 않은 의술이다."

 jfp_culture.20.t:0 "말뚝이의 재담"
 jfp_culture.20.d:0 "장터에서 열린 탈춤 마당에서 양반을 조롱하는 대목이 유난히 인기를 끌고 있다. 고을의 양반들은 이를 금지해 달라고 수령에게 청했다."
 jfp_culture.20.f:0 "“쉬이! 양반 나오신다! 양반이라고 하니까 노론, 소론, 호조, 병조 다 지낸 퇴로 재상으로 계신 양반인 줄 아지 마시오. 개잘량이라는 ‘양’자에 개다리소반이라는 ‘반’자 쓰는 양반이오!”\n\n— 봉산탈춤 말뚝이의 대사 (축약)"
 jfp_culture.20.a:0 "놀이일 뿐이다. 그냥 두어라."
 jfp_culture.20.b:0 "풍속을 어지럽히니 금하라."

 jfp_culture.21.t:0 "정감록"
 jfp_culture.21.d:0 "이씨의 왕조가 다하고 정씨 성을 가진 진인(眞人)이 계룡산에 도읍을 세운다는 예언서 『정감록』이 다시 은밀히 퍼지고 있다. 일부 고을에서는 피난처라는 십승지로 이주하는 이들까지 생겼다."
 jfp_culture.21.f:0 "“계룡산 아래 새 도읍이 선다 하더이다.”\n\n“쉿! 그런 말 함부로 했다간 목이 달아나오.”"
 jfp_culture.21.a:0 "요언을 퍼뜨리는 자를 잡아들여라."
 jfp_culture.21.b:0 "헛소문은 저절로 사그라진다."

 jfp_culture.22.t:0 "까치와 호랑이"
 jfp_culture.22.d:0 "여염집 벽마다 까치와 호랑이, 책거리, 꽃과 새를 그린 그림이 걸리고 있다. 이름 없는 화공들이 그린 소박한 그림이지만 백성들의 소망이 담겨 있다."
 jfp_culture.22.f:0 "장터 그림 장수 앞에서 아낙이 한참을 망설였다. 결국 고른 것은 잉어 그림이었다. 아들이 과거에 급제하기를 비는 마음이었다."
 jfp_culture.22.a:0 "보기 좋은 풍경이다."

 jfp_culture.23.t:0 "세책점의 소설"
 jfp_culture.23.d:0 "목판으로 찍어 파는 한글 소설과, 돈을 받고 책을 빌려주는 세책점이 성행하고 있다. 『춘향전』, 『심청전』, 『홍길동전』 같은 이야기가 부녀자와 상민 사이에서 널리 읽힌다."
 jfp_culture.23.f:0 "“아씨, 그 대목은 그만 읽으셔요. 소인이 또 울겠어요.”\n\n등잔불 아래 모여 앉은 여인들 가운데 하나가 치맛자락으로 눈가를 훔쳤다."
 jfp_culture.23.a:0 "백성이 글을 익히는 일이다. 장려하라."
 jfp_culture.23.b:0 "음란하고 허황된 이야기다."

 jfp_culture.24.t:0 "장시의 번성"
 jfp_culture.24.d:0 "닷새마다 서는 장시가 크게 번성하여, 보부상들이 전국의 장을 돌며 물건을 사고팔고 있다. 상인들은 조정에 장세를 줄여 달라고 청한다."
 jfp_culture.24.f:0 "등짐장수가 지게를 내려놓고 땀을 훔쳤다. “오늘 이 장이 끝나면 내일은 저 고개 너머 장이오. 발이 곧 우리 밑천이지.”"
 jfp_culture.24.a:0 "상업을 장려하라."
 jfp_culture.24.b:0 "근본은 농사다. 장시가 지나치게 커서는 안 된다."

 jfp_culture.25.t:0 "단오"
 jfp_culture.25.d:0 "단옷날을 맞아 곳곳에서 씨름판과 그네뛰기가 벌어지고 있다. 고을에서는 잔치 비용을 관에서 보태 달라고 청한다."
 jfp_culture.25.f:0 "창포물에 머리를 감은 처녀들이 그네를 탔다. 그네가 높이 오를 때마다 담장 너머로 구경하던 총각들의 고개가 함께 올라갔다."
 jfp_culture.25.a:0 "관에서 잔치를 열어 백성과 함께 즐기라."
 jfp_culture.25.b:0 "백성들끼리 즐기게 두어라."

 jfp_culture.26.t:0 "타는 논"
 jfp_culture.26.d:0 "모내기 철에 비가 오지 않아 논바닥이 갈라지고 있다. 고을마다 기우제를 지내자는 목소리와, 보와 저수지를 정비하자는 목소리가 엇갈린다."
 jfp_culture.26.f:0 "늙은 농부가 마른 논바닥에 주저앉아 하늘을 올려다보았다. 구름 한 점 없었다."
 jfp_culture.26.a:0 "임금이 친히 기우제를 올리겠다."
 jfp_culture.26.b:0 "보와 저수지를 정비하고 곡식을 풀어라."
