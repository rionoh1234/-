l_english:
 # ─────────────── 대업 캠페인: 세력권 이름 ───────────────
 jfp_pb_daedonga:0 "대동아 공영권"

 # ─────────────── 툴팁 ───────────────
 jfp_tt_daeup_sovereign:0 "자주권을 지니고 있음 (청과의 조공 관계 외의 종속 관계가 없음)"
 jfp_tt_daeup_2_japan:0 "#v 일본#!보다 GDP와 육군 전력 투사력이 모두 높음 (일본이 없으면 충족)"
 jfp_tt_daeup_3_korea:0 "한반도 전역(#v 경기·영남·양호·관북·양서#!)을 조선 또는 속국이 차지함"
 jfp_tt_daeup_3_manchuria:0 "만주 핵심부(#v 성경·남부 길림·북부 길림·남부 흑룡강#!)를 조선 또는 속국이 차지함"
 jfp_tt_daeup_4_china:0 "#v 청#!이 조선의 속국이거나 같은 세력권에 속함 (청이 없으면 충족)"
 jfp_tt_daeup_4_japan:0 "#v 일본#!이 조선의 속국이거나 같은 세력권에 속함 (일본이 없으면 충족)"
 jfp_tt_daeup_5_east_asia:0 "#v 동아시아#!의 모든 나라가 조선의 속국이거나 같은 세력권에 속함"
 jfp_tt_daeup_5_south_east_asia:0 "#v 동남아시아#!의 모든 나라가 조선의 속국이거나 같은 세력권에 속함"
 jfp_tt_daeup_5_no_foreign_states:0 "#v 동아시아#!에 공영권 밖 나라가 차지한 주(州)가 하나도 없음"
 jfp_tt_independence_cooldown:0 "최근 5년 안에 자주를 선언하지 않았음"
 jfp_tt_claims_manchuria:0 "#v 만주#! 전역에 대한 영유권 주장을 얻습니다."
 jfp_tt_homeland_manchuria:0 "#v 만주#! 전역이 #v 조선인#!의 고향 땅이 됩니다."

 # ─────────────── 저널 ───────────────
 je_jfp_daeup_1:0 "대업 1: 자주독립"
 je_jfp_daeup_1_reason:0 "조선은 수백 년 동안 청을 종주국으로 섬겨 왔다. 매년 조공을 바치고 칙사를 맞이하며, 나라의 중대사도 연경의 눈치를 살펴야 한다. 대업의 첫걸음은 이 사슬을 끊는 것이다.\n\n#b 목표:#! 어떤 나라의 속국도 아닌 상태가 된다.\n#b 수단:#! 결정 '자주 선언'으로 종주국과의 독립 분쟁을 시작할 수 있다."
 je_jfp_daeup_2:0 "대업 2: 부국강병"
 je_jfp_daeup_2_reason:0 "자주를 얻었으나 열강은 조선을 대등한 나라로 보지 않는다. 바다 건너 일본은 이미 서양을 본받아 무섭게 성장하고 있다. 열강의 인정을 받고 이웃을 앞지르지 못하면, 되찾은 자주도 오래가지 못할 것이다."
 je_jfp_daeup_3:0 "대업 3: 고토 회복"
 je_jfp_daeup_3_reason:0 "압록강과 두만강 너머의 넓은 땅은 한때 고구려와 발해의 강역이었다. 청 황실의 발상지라 하여 오랫동안 봉금되었던 그 땅에는 이미 조선 유민들이 건너가 터를 잡고 있다. 이제 그 땅을 되찾을 때다."
 je_jfp_daeup_4:0 "대업 4: 동아시아의 패자"
 je_jfp_daeup_4_reason:0 "조선은 더 이상 대국 사이에 끼인 작은 나라가 아니다. 그러나 동아시아의 질서를 새로 쓰려면 오랜 종주국 청과 바다 건너의 일본을 모두 굴복시켜야 한다. 서양 열강은 이 새로운 패자의 등장을 결코 반기지 않을 것이다."
 je_jfp_daeup_5:0 "대업 5: 대동아 공영권"
 je_jfp_daeup_5_reason:0 "조선이 이끄는 공영권 아래 동아시아와 동남아시아의 모든 나라를 하나로 묶고, 이 땅에서 서양 열강의 거점을 모두 몰아낸다. 대업의 마지막 장이다."

 # ─────────────── 결정 ───────────────
 jfp_dec_declare_independence:0 "자주 선언"
 jfp_dec_declare_independence_desc:0 "종주국에 더 이상 조공을 바치지 않겠다고 선언하고, 자주독립을 걸고 외교 분쟁을 시작한다. 종주국이 순순히 물러날 리 없으니 전쟁을 각오해야 한다."
 jfp_dec_found_daedonga:0 "대동아 공영권 결성"
 jfp_dec_found_daedonga_desc:0 "조선을 맹주로 하는 새로운 세력권을 세운다. 동아시아의 나라들을 이 깃발 아래 모으는 것이 대업의 마지막 목표가 된다."

 # ─────────────── 수정자: 역경 ───────────────
 jfp_trial_qing_suzerainty:0 "청의 종주권"
 jfp_trial_qing_suzerainty_desc:0 "해마다 바치는 공물이 재정을 축내고, 자주를 바라는 목소리는 높아진다."
 jfp_trial_foreign_creditors:0 "외국 채권자"
 jfp_trial_foreign_creditors_desc:0 "근대화 자금을 빌려준 외국 은행들이 높은 이자를 요구한다."
 jfp_trial_northern_expedition:0 "북벌 준비"
 jfp_trial_northern_expedition_desc:0 "고토 회복을 위해 장정을 모으느라 백성의 살림이 팍팍해졌다."
 jfp_trial_containment:0 "열강의 견제"
 jfp_trial_containment_desc:0 "새로운 강국의 등장을 경계하는 열강이 조선의 일거수일투족을 주시한다."
 jfp_trial_burden_of_hegemon:0 "맹주의 무게"
 jfp_trial_burden_of_hegemon_desc:0 "거대한 공영권을 이끄는 일은 조선의 관료와 백성 모두에게 무거운 짐이다."
 jfp_trial_tribute_burden:0 "과중한 공물"
 jfp_trial_tribute_burden_desc:0 "늘어난 공물과 재정 부담이 국고를 짓누른다."
 jfp_trial_envoy_humiliation:0 "굴욕적인 외교"
 jfp_trial_envoy_humiliation_desc:0 "외국 사신 앞에서 고개를 숙인 일이 조정의 위신을 깎았다."
 jfp_trial_sadae_faction:0 "사대파의 저항"
 jfp_trial_sadae_faction_desc:0 "종주국과의 관계를 중시하는 대신들이 개혁에 제동을 건다."
 jfp_trial_concessions:0 "외국의 이권"
 jfp_trial_concessions_desc:0 "광산과 세원이 외국인의 손에 넘어갔다."
 jfp_trial_war_debt:0 "차관의 덫"
 jfp_trial_war_debt_desc:0 "외국에서 빌린 돈의 이자가 재정을 갉아먹는다."
 jfp_trial_bandits:0 "만주 마적"
 jfp_trial_bandits_desc:0 "국경 너머 마적 떼가 마을을 약탈하고 길을 끊는다."
 jfp_trial_intervention_yielded:0 "열강에 대한 굴복"
 jfp_trial_intervention_yielded_desc:0 "열강의 압력에 물러섰다는 사실이 나라 안팎에 알려졌다."
 jfp_trial_expedition_fatigue:0 "원정의 피로"
 jfp_trial_expedition_fatigue_desc:0 "끝없는 원정에 병사도 백성도 지쳐 간다."
 jfp_trial_member_unrest:0 "가맹국의 동요"
 jfp_trial_member_unrest_desc:0 "공영권 가맹국들 사이에서 맹주에 대한 불만이 커지고 있다."
 jfp_trial_defiance:0 "결연한 의지"
 jfp_trial_defiance_desc:0 "굴하지 않는 조정의 태도에 민심이 하나로 뭉친다."
 jfp_trial_national_resolve:0 "거국적 항전 태세"
 jfp_trial_national_resolve_desc:0 "나라 전체가 외적에 맞설 준비를 하고 있다."

 # ─────────────── 수정자: 보상 ───────────────
 jfp_reward_jaju:0 "자주독립국"
 jfp_reward_jaju_desc:0 "수백 년 만에 종주국의 사슬을 끊었다. 공물로 새던 재정이 국고로 돌아오고, 군대는 오직 이 나라를 위해 싸운다."
 jfp_reward_bugguk:0 "부국강병"
 jfp_reward_bugguk_desc:0 "나라는 부유해지고 군대는 강해졌다. 열강도 이제 조선을 무시하지 못한다."
 jfp_reward_goto:0 "고토 회복"
 jfp_reward_goto_desc:0 "고구려와 발해의 옛 땅이 다시 조선의 품으로 돌아왔다."
 jfp_reward_hegemony:0 "동아시아의 패자"
 jfp_reward_hegemony_desc:0 "청과 일본을 굴복시키고 동아시아 질서의 중심에 섰다. 속국들은 순종하고, 조선의 팽창을 문제 삼는 목소리는 잦아든다."
 jfp_reward_daedonga:0 "대동아 공영권의 맹주"
 jfp_reward_daedonga_desc:0 "조선이 동아시아와 동남아시아를 아우르는 공영권의 맹주가 되었다."
 jfp_reward_construction_boom:0 "부흥의 열기"
 jfp_reward_construction_boom_desc:0 "대업의 성취에 고무된 전국이 건설 사업에 뛰어들고 있다."
 jfp_reward_construction_boom_small:0 "재건의 기운"
 jfp_reward_construction_boom_small_desc:0 "새로운 출발을 맞아 곳곳에서 재건 공사가 시작되었다."
 jfp_reward_daedonga_bloc:0 "대동아의 결속"
 jfp_reward_daedonga_bloc_desc:0 "서양 열강을 몰아낸 공영권이 하나의 질서로 굳게 결속하였다."
