 jfp_tt_seohak_resolved_tolerate:0 "서학을 #v 세 차례 이상#! 관용함"
 jfp_tt_yangyo_sinmi_done:0 "#v 신미양요#!가 마무리됨"

 # ─────────────── 저널 ───────────────
 je_jfp_sedo_politics:0 "세도정치"
 je_jfp_sedo_politics_reason:0 "어린 임금이 보위에 오른 뒤 국정은 왕실 외척 가문의 손에 넘어갔다. 비변사를 장악한 세도가는 인사와 재정을 좌우하고, 관직은 공공연히 매매된다. 임금의 권위를 되찾지 못한다면 이 체제는 대를 이어 굳어질 것이다.\n\n#b 왕권 회복#! 진행도를 100까지 올리면 세도정치를 끝낼 수 있다."
 je_jfp_samjeong:0 "삼정의 문란"
 je_jfp_samjeong_reason:0 "나라 재정의 근간인 전정(田政)·군정(軍政)·환곡(還穀)이 모두 무너졌다. 장부에 없는 땅은 세금을 내지 않고, 죽은 이와 갓난아이에게까지 군포가 매겨지며, 구휼을 위한 환곡은 고리대로 변했다. 백성의 원성이 곳곳에서 들끓는다.\n\n#b 삼정 이정#! 진행도를 100까지 올리면 제도를 바로잡을 수 있다."
 je_jfp_seohak:0 "서학과 천주교"
 je_jfp_seohak_reason:0 "청나라를 통해 들어온 서학(西學)과 천주교는 양반 일부와 중인, 부녀자 사이에 은밀히 퍼지고 있다. 조정은 이를 사학(邪學)으로 규정했으나, 그 안에 담긴 서양의 학문을 아깝게 여기는 이들도 있다. 박해할 것인가, 관용할 것인가."
 je_jfp_daewongun:0 "흥선대원군의 섭정"
 je_jfp_daewongun_reason:0 "어린 임금의 생부 흥선대원군이 실권을 쥐었다. 세도가를 몰아내고 왕실의 위엄을 되살리려는 그의 개혁은 과감하지만, 그만큼 반발도 거세다. 그가 물러나기 전에 개혁을 얼마나 이루어 낼 수 있을까.\n\n#b 대원군 개혁#! 진행도를 100까지 올리면 개혁이 완수된다."
 je_jfp_yangyo:0 "양요: 서양의 도전"
 je_jfp_yangyo_reason:0 "이양선(異樣船)이 해안에 나타나는 일이 잦아졌다. 서양 열강은 통상을 요구하며 무력을 앞세운다. 나라의 문을 굳게 닫아 지킬 것인가, 아니면 열 것인가."
 je_jfp_gaehwa:0 "개항과 개화"
 je_jfp_gaehwa_reason:0 "문호가 열리고 낯선 문물이 밀려든다. 개화를 서두르자는 젊은 관료들과, 성리학의 정도를 지키자는 유림이 맞선다. 열강의 틈바구니에서 나라의 자주를 지키려면 스스로 힘을 길러야 한다.\n\n#b 개화#! 진행도를 100까지 올리면 개화를 완수한다."
 je_jfp_gwangmu:0 "광무개혁"
 je_jfp_gwangmu_reason:0 "황제국을 선포한 이상, 그 이름에 걸맞은 실력을 갖추어야 한다. 옛것을 근본으로 삼고 새것을 참작한다는 구본신참(舊本新參)의 기치 아래 토지·군사·산업 전반의 개혁이 시작된다.\n\n#b 광무개혁#! 진행도를 100까지 올리면 개혁을 완수한다."

 # ─────────────── 결정 ───────────────
 jfp_dec_amhaeng_eosa:0 "암행어사 파견"
 jfp_dec_amhaeng_eosa_desc:0 "마패를 지닌 어사를 몰래 지방에 보내 수령의 비리를 살핀다. 탐관오리는 두려워하겠지만, 그 수령들을 천거한 세도가의 심기는 불편해질 것이다."
 jfp_dec_gyujanggak:0 "규장각 기능 회복"
 jfp_dec_gyujanggak_desc:0 "정조 대왕이 세운 규장각과 초계문신 제도를 되살려, 임금에게 충성하는 젊은 인재를 직접 길러 낸다."
 jfp_dec_purge_inlaws:0 "외척 축출"
 jfp_dec_purge_inlaws_desc:0 "이제 임금의 힘이 충분히 자랐다. 요직을 독점한 외척 가문을 조정에서 몰아낸다. 반발은 피할 수 없다."
 jfp_dec_samjeong_ijeongcheong:0 "삼정이정청 설치"
 jfp_dec_samjeong_ijeongcheong_desc:0 "전정·군정·환곡의 폐단을 바로잡을 임시 관청을 두고 개혁안을 마련한다."
 jfp_dec_hwangok_relief:0 "환곡 탕감"
 jfp_dec_hwangok_relief_desc:0 "백성을 짓누르는 환곡의 묵은 빚을 국고로 덜어 준다."
 jfp_dec_land_survey:0 "양전 실시"
 jfp_dec_land_survey_desc:0 "토지를 다시 측량하여 장부에서 빠진 은결(隱結)을 찾아내고 세금을 공정하게 매긴다."
 jfp_dec_seowon:0 "서원 철폐"
 jfp_dec_seowon_desc:0 "면세와 면역의 특권을 누리며 붕당의 근거지가 된 서원을 정리한다. 사액서원 일부만 남기고 나머지는 모두 철폐한다."
 jfp_dec_gyeongbokgung:0 "경복궁 중건"
 jfp_dec_gyeongbokgung_desc:0 "임진왜란 때 불탄 뒤 수백 년간 폐허로 남은 법궁을 다시 세워 왕실의 위엄을 만방에 보인다. 막대한 재원과 노동력이 들 것이다."
 jfp_dec_hopo:0 "호포제 실시"
 jfp_dec_hopo_desc:0 "상민에게만 걷던 군포를 양반 호(戶)에도 매긴다. 양반들은 격분하겠지만 백성의 부담은 줄어든다."
 jfp_dec_sachang:0 "사창제 실시"
 jfp_dec_sachang_desc:0 "관이 운영하던 환곡을 마을 단위의 사창(社倉)으로 넘겨 관리들의 착복을 막는다."
 jfp_dec_uijeongbu:0 "비변사 혁파와 의정부 복원"
 jfp_dec_uijeongbu_desc:0 "세도가의 권력 기반이었던 비변사를 없애고, 의정부와 삼군부가 본래의 기능을 되찾게 한다."
 jfp_dec_dangbaekjeon:0 "당백전 발행"
 jfp_dec_dangbaekjeon_desc:0 "상평통보 백 배의 가치를 지닌 고액 화폐를 찍어 부족한 재원을 메운다. 물가가 크게 오를 위험이 있다."
 jfp_dec_coastal_forts:0 "해안 방비 강화"
 jfp_dec_coastal_forts_desc:0 "강화도를 비롯한 해안 요충지에 포대를 쌓고 진무영의 병력을 늘린다."
 jfp_dec_cheokhwabi:0 "척화비 건립"
 jfp_dec_cheokhwabi_desc:0 "‘서양 오랑캐가 침범하는데 싸우지 않으면 화친하자는 것이요, 화친을 주장함은 나라를 파는 것이다.’ 이 글을 새긴 비석을 전국 요소에 세운다."
 jfp_dec_tongni_amun:0 "통리기무아문 설치"
 jfp_dec_tongni_amun_desc:0 "외교·군사·통상 등 새로운 업무를 총괄할 근대적 관청을 둔다."
 jfp_dec_byeolgigun:0 "별기군 창설"
 jfp_dec_byeolgigun_desc:0 "신식 무기와 교관을 갖춘 신식 군대를 따로 조직한다. 대우가 나빠진 구식 군인들의 불만이 쌓일 수 있다."
 jfp_dec_bakmunguk:0 "박문국 설치와 한성순보 발간"
 jfp_dec_bakmunguk_desc:0 "인쇄 관청 박문국을 두고 관보 성격의 신문을 펴내 국내외 소식을 알린다."
 jfp_dec_gigichang:0 "기기창 설치"
 jfp_dec_gigichang_desc:0 "근대식 무기를 직접 만들어 낼 공장을 세운다."
 jfp_dec_jeonhwanguk:0 "전환국 설치"
 jfp_dec_jeonhwanguk_desc:0 "근대식 화폐를 주조할 관청을 두어 문란한 화폐 제도를 정비한다."
 jfp_dec_yugyeong:0 "육영공원 설립"
 jfp_dec_yugyeong_desc:0 "외국인 교사를 초빙하여 양반 자제에게 영어와 신학문을 가르치는 관립 학교를 연다."
 jfp_dec_wonsan_school:0 "원산학사 지원"
 jfp_dec_wonsan_school_desc:0 "개항장 원산의 관민이 힘을 모아 세운 학교를 지원하여 신학문 교육을 넓힌다."
 jfp_dec_yangjeon_jigye:0 "양전·지계 사업"
 jfp_dec_yangjeon_jigye_desc:0 "전국의 토지를 측량하고 소유자에게 근대적 토지 증서인 지계(地契)를 발급한다."
 jfp_dec_wonsubu:0 "원수부 설치"
 jfp_dec_wonsubu_desc:0 "황제가 대원수로서 군을 직접 통솔하는 최고 군령 기관을 둔다."
 jfp_dec_hanseong_electric:0 "한성전기회사 설립"
 jfp_dec_hanseong_electric_desc:0 "황실이 출자하여 전기와 전차 사업을 벌이는 회사를 세운다."
 jfp_dec_gyeongin_railway:0 "경인선 부설"
 jfp_dec_gyeongin_railway_desc:0 "서울과 제물포를 잇는 철도를 놓아 개항장과 수도를 연결한다."
 jfp_dec_cheonil_bank:0 "대한천일은행 설립"
 jfp_dec_cheonil_bank_desc:0 "민족 자본으로 은행을 세워 외국 은행의 금융 지배에 맞선다."

 # ─────────────── 수정자 ───────────────
 jfp_ig_approval_up:0 "조정의 배려"
 jfp_ig_approval_up_desc:0 "최근 조정의 결정이 이 집단의 뜻에 부합했다."
 jfp_ig_approval_up_large:0 "조정의 각별한 배려"
 jfp_ig_approval_up_large_desc:0 "최근 조정의 결정이 이 집단에 크게 유리했다."
 jfp_ig_approval_down:0 "조정에 대한 불만"
 jfp_ig_approval_down_desc:0 "최근 조정의 결정이 이 집단의 뜻에 어긋났다."
 jfp_ig_approval_down_large:0 "조정에 대한 격분"
 jfp_ig_approval_down_large_desc:0 "최근 조정의 결정이 이 집단의 이익을 크게 해쳤다."
 jfp_ig_strength_up:0 "세력 확장"
 jfp_ig_strength_up_desc:0 "이 집단의 영향력이 커졌다."
 jfp_ig_strength_down:0 "세력 위축"
 jfp_ig_strength_down_desc:0 "이 집단의 영향력이 줄었다."
 jfp_sedo_dominance:0 "세도가의 국정 장악"
 jfp_sedo_dominance_desc:0 "외척 가문이 비변사를 통해 인사와 재정을 좌우하고 있다."
 jfp_sale_of_offices:0 "매관매직의 만연"
 jfp_sale_of_offices_desc:0 "돈으로 산 벼슬아치들이 본전을 뽑으려 백성을 수탈한다."
 jfp_sale_of_offices_profit:0 "관직 매매 수입"
 jfp_sale_of_offices_profit_desc:0 "조정이 관직을 팔아 재원을 마련했지만, 관료 사회의 기강은 무너졌다."
 jfp_amhaeng_eosa:0 "어사 출두"
 jfp_amhaeng_eosa_desc:0 "암행어사가 지방을 돌며 수령들의 비리를 감찰하고 있다."
 jfp_gyujanggak_scholars:0 "규장각의 인재들"
 jfp_gyujanggak_scholars_desc:0 "임금이 직접 기른 학자 관료들이 국정에 참여하고 있다."
 jfp_royal_authority_restored:0 "왕권 회복"
 jfp_royal_authority_restored_desc:0 "세도정치가 막을 내리고 임금이 친히 국정을 이끈다."
 jfp_sedo_entrenched:0 "고착된 세도정치"
 jfp_sedo_entrenched_desc:0 "외척의 권력이 대를 이어 굳어져 왕실의 권위가 땅에 떨어졌다."
 jfp_royal_wedding:0 "국혼의 경사"
 jfp_royal_wedding_desc:0 "새 왕비의 간택으로 왕실에 경사가 났다."
 jfp_samjeong_corruption:0 "삼정의 문란"
 jfp_samjeong_corruption_desc:0 "전정·군정·환곡의 폐단으로 세금은 새고 백성은 신음한다."
 jfp_hwangok_usury:0 "환곡의 고리대"
 jfp_hwangok_usury_desc:0 "구휼 제도였던 환곡이 고리대로 변해 농민을 옥죈다."
 jfp_gunpo_abuse:0 "백골징포와 황구첨정"
 jfp_gunpo_abuse_desc:0 "죽은 이와 갓난아이에게까지 군포가 매겨지고 있다."
 jfp_hidden_fields:0 "은결"
 jfp_hidden_fields_desc:0 "장부에서 빠진 토지가 세금을 내지 않는다."
 jfp_land_survey:0 "양전"
 jfp_land_survey_desc:0 "토지를 다시 측량하여 과세의 근거를 바로잡았다."
 jfp_peasant_uprising:0 "민란의 여파"
 jfp_peasant_uprising_desc:0 "농민 봉기의 상처가 아직 가시지 않았다."
 jfp_samjeong_reformed:0 "삼정 이정"
 jfp_samjeong_reformed_desc:0 "삼정의 폐단을 바로잡아 재정이 건전해지고 민심이 안정되었다."
 jfp_famine_relief:0 "진휼"
 jfp_famine_relief_desc:0 "조정이 굶주린 백성에게 곡식을 풀었다."
 jfp_famine:0 "기근"
 jfp_famine_desc:0 "흉년으로 굶어 죽는 이가 늘고 있다."
 jfp_seohak_persecution:0 "사학 엄금"
 jfp_seohak_persecution_desc:0 "조정이 천주교를 사학으로 규정하고 엄히 다스리고 있다."
 jfp_seohak_tolerance:0 "서학에 대한 관용"
 jfp_seohak_tolerance_desc:0 "조정이 서학을 묵인하자 서양의 지식이 조용히 퍼지고 있다."
 jfp_martyr_memory:0 "순교의 기억"
