l_english:
 # ─────────────── 툴팁 ───────────────
 jfp_tt_cab_cooldown:0 "최근 3년 안에 이 직책을 바꾸지 않았음"
 jfp_tt_play_cooldown:0 "최근 5년 안에 같은 외교 분쟁을 시작하지 않았음"
 jfp_tt_ryukyu_opened:0 "#v 류큐 문제#! 저널이 열립니다."
 jfp_tt_claim_formosa:0 "#v 대만#!에 대한 영유권 주장을 얻고, #v 대만 개척#! 저널이 열립니다."
 jfp_tt_japan_opened:0 "#v 일본 개항#! 저널이 열립니다."
 jfp_tt_japan_port_owned:0 "#v 일본#! 지역에 조선이 직접 차지한 주(조약항 포함)가 있음"
 jfp_tt_manchuria_opened:0 "#v 만주 경영#! 저널이 열립니다."
 jfp_tt_manchuria_states:0 "현재 조선이 차지한 #v 만주#!의 모든 주에 적용됩니다."
 jfp_tt_manchuria_dev_up:0 "#v 만주 경영#! 진행도 #G +25#!"

 # ─────────────── 저널 ───────────────
 je_jfp_ryukyu:0 "류큐 문제"
 je_jfp_ryukyu_reason:0 "남쪽 바다의 류큐 왕국은 청에 조공하면서도 일본 사쓰마 번의 간섭을 받아 온 나라다. 조선과는 일찍이 사신을 주고받던 이웃이기도 하다. 일본이 류큐를 삼키기 전에 조선이 먼저 손을 내밀 수 있을까.\n\n#b 목표:#! 류큐를 조선의 속국으로 만들거나 류큐 제도를 차지한다.\n#b 수단:#! 결정 '류큐 조공 요구'"
 je_jfp_formosa:0 "대만 개척"
 je_jfp_formosa_reason:0 "류큐 너머 남쪽의 큰 섬 대만은 청이 다스리지만, 산지에는 청의 힘이 미치지 않는 원주민 부족들이 살고 있다. 장뇌와 사탕수수, 차가 풍부한 이 섬은 남쪽 바다로 나아가는 디딤돌이 될 것이다.\n\n#b 목표:#! 대만 전역을 차지한다.\n#b 수단:#! 결정 '대만 원정'"
 je_jfp_japan_port:0 "일본 개항"
 je_jfp_japan_port_reason:0 "수백 년 동안 일본은 부산의 왜관을 통해서만 조선과 교역해 왔다. 이제 처지를 바꿀 때다. 일본의 항구 하나를 조선의 조약항으로 열게 하여 바다 건너 교역의 주도권을 쥔다.\n\n#b 목표:#! 일본 지역에 조선의 주(조약항 포함)를 확보하거나 일본을 속국으로 만든다.\n#b 수단:#! 결정 '일본 조약항 요구'"
 je_jfp_manchuria_dev:0 "만주 경영"
 je_jfp_manchuria_dev_reason:0 "압록강과 두만강을 건넌 조선 유민들이 간도의 황무지를 일구고 있다. 이 땅을 진정한 조선의 땅으로 만들려면 사람과 길과 병력이 필요하다.\n\n#b 만주 경영#! 진행도를 100까지 올리면 완료된다. 각 결정의 효과는 #v 결정을 내리는 시점에 조선이 차지한 만주의 주#!에 적용된다."

 # ─────────────── 결정 ───────────────
 jfp_dec_cab_pm:0 "영의정 임명"
 jfp_dec_cab_pm_desc:0 "백관의 으뜸인 영의정을 새로 임명하여 국정의 방향을 정한다."
 jfp_dec_cab_finance:0 "호조판서 임명"
 jfp_dec_cab_finance_desc:0 "나라의 재정을 맡을 호조판서를 새로 임명한다."
 jfp_dec_cab_army:0 "병조판서 임명"
 jfp_dec_cab_army_desc:0 "군사와 국방을 맡을 병조판서를 새로 임명한다."
 jfp_dec_cab_rites:0 "예조판서 임명"
 jfp_dec_cab_rites_desc:0 "교육과 의례, 외교를 맡을 예조판서를 새로 임명한다."
 jfp_dec_cab_works:0 "공조판서 임명"
 jfp_dec_cab_works_desc:0 "토목과 공업을 맡을 공조판서를 새로 임명한다."
 jfp_dec_ryukyu_tributary:0 "류큐 조공 요구"
 jfp_dec_ryukyu_tributary_desc:0 "류큐 왕국에 조선을 종주국으로 섬기라고 요구하는 외교 분쟁을 시작한다."
 jfp_dec_formosa_expedition:0 "대만 원정"
 jfp_dec_formosa_expedition_desc:0 "대만의 한 주를 차지하기 위한 외교 분쟁을 시작한다. 섬 전체를 얻으려면 여러 번 원정해야 할 수도 있다."
 jfp_dec_japan_port:0 "일본 조약항 요구"
 jfp_dec_japan_port_desc:0 "규슈의 항구를 조선의 조약항으로 내놓으라고 일본에 요구하는 외교 분쟁을 시작한다."
 jfp_dec_manchuria_migration:0 "간도 이주 장려"
 jfp_dec_manchuria_migration_desc:0 "조선 백성의 만주 이주를 장려하고 정착을 지원한다."
 jfp_dec_manchuria_tunjeon:0 "둔전 개간"
 jfp_dec_manchuria_tunjeon_desc:0 "군과 이주민이 함께 황무지를 개간하는 둔전을 설치한다."
 jfp_dec_manchuria_railway:0 "만주 철도 부설"
 jfp_dec_manchuria_railway_desc:0 "만주의 광산과 들판을 한반도와 잇는 철도를 놓는다."
 jfp_dec_manchuria_garrison:0 "국경 수비대 설치"
 jfp_dec_manchuria_garrison_desc:0 "마적과 외적에 대비하여 만주 각지에 수비대를 둔다."

 # ─────────────── 수정자 ───────────────
 jfp_cab_pm_conservative:0 "영의정: 노론 원로"
 jfp_cab_pm_conservative_desc:0 "노련한 원로 대신이 조정을 안정시키고 있다."
 jfp_cab_pm_moderate:0 "영의정: 실무 관료"
 jfp_cab_pm_moderate_desc:0 "행정에 밝은 관료가 국정을 효율적으로 이끈다."
 jfp_cab_pm_reform:0 "영의정: 개화파"
 jfp_cab_pm_reform_desc:0 "개혁을 서두르는 영의정이 새 법을 밀어붙이지만, 반발도 크다."
 jfp_cab_finance_conservative:0 "호조: 엄정한 징세"
 jfp_cab_finance_conservative_desc:0 "호조가 세금을 빈틈없이 거두고 있다."
 jfp_cab_finance_moderate:0 "호조: 건전 재정"
 jfp_cab_finance_moderate_desc:0 "신중한 재정 운용으로 나라의 신용이 높아졌다."
 jfp_cab_finance_reform:0 "호조: 세제 근대화"
 jfp_cab_finance_reform_desc:0 "근대적 세제로 세원이 넓어졌다."
 jfp_cab_army_conservative:0 "병조: 군적 정비"
 jfp_cab_army_conservative_desc:0 "군적을 정비하여 더 많은 장정을 모을 수 있다."
 jfp_cab_army_moderate:0 "병조: 방어 중시"
 jfp_cab_army_moderate_desc:0 "성곽과 진보를 정비하여 방어력을 높였다."
 jfp_cab_army_reform:0 "병조: 신식 군제"
 jfp_cab_army_reform_desc:0 "신식 훈련과 편제로 군대가 날카로워졌다."
 jfp_cab_rites_conservative:0 "예조: 예법 수호"
 jfp_cab_rites_conservative_desc:0 "예조가 유교 예법을 엄격히 지키고 있다."
 jfp_cab_rites_moderate:0 "예조: 교린 외교"
 jfp_cab_rites_moderate_desc:0 "예조가 이웃 나라와의 외교에 힘쓰고 있다."
 jfp_cab_rites_reform:0 "예조: 신식 학교"
 jfp_cab_rites_reform_desc:0 "예조가 신식 학교를 세워 교육을 넓히고 있다."
 jfp_cab_works_conservative:0 "공조: 수리 사업"
 jfp_cab_works_conservative_desc:0 "보와 제방을 정비하여 농사가 풍족해졌다."
 jfp_cab_works_moderate:0 "공조: 토목 사업"
 jfp_cab_works_moderate_desc:0 "도로와 관아 공사가 활발하다."
 jfp_cab_works_reform:0 "공조: 식산흥업"
 jfp_cab_works_reform_desc:0 "공조가 공장 설립을 적극 지원하고 있다."
 jfp_ryukyu_tributary:0 "류큐 조공"
 jfp_ryukyu_tributary_desc:0 "류큐가 조선의 조공국이 되어 남쪽 바다의 교역로가 열렸다."
 jfp_ryukyu_question:0 "류큐 문제"
 jfp_ryukyu_question_desc:0 "류큐를 둘러싼 조선의 움직임을 이웃 나라들이 경계하고 있다."
 jfp_formosa_settled:0 "대만 개척"
 jfp_formosa_settled_desc:0 "대만의 농장과 산림이 조선의 경제에 활력을 더한다."
 jfp_formosa_hardship:0 "남방의 풍토병"
 jfp_formosa_hardship_desc:0 "낯선 기후와 풍토병이 원정군을 괴롭힌다."
 jfp_japan_trade_pressure:0 "일본 개항 압박"
 jfp_japan_trade_pressure_desc:0 "일본에 개항을 요구하는 조선의 태도를 열강이 주시하고 있다."
 jfp_japan_opened:0 "일본 조약항"
 jfp_japan_opened_desc:0 "일본의 항구가 조선 상선에 열려 바다 건너 교역이 크게 늘었다."
 jfp_manchuria_migration:0 "간도 이주민"
 jfp_manchuria_migration_desc:0 "조선 유민들이 이 땅에 정착하고 있다."
 jfp_manchuria_tunjeon:0 "만주 둔전"
 jfp_manchuria_tunjeon_desc:0 "개간한 둔전에서 곡식과 목재가 나온다."
 jfp_manchuria_railway:0 "만주 철도"
 jfp_manchuria_railway_desc:0 "철도가 광산과 들판을 한반도와 잇는다."
 jfp_manchuria_garrison:0 "만주 수비대"
 jfp_manchuria_garrison_desc:0 "수비대가 마적을 막고 치안을 유지한다."
 jfp_manchuria_developed:0 "만주 경영의 결실"
 jfp_manchuria_developed_desc:0 "만주가 조선의 땅으로 뿌리내렸다."

 # ─────────────── 의정부 인사 이벤트 ───────────────
 jfp_cab.1.t:0 "영의정 천거"
 jfp_cab.1.d:0 "영의정 자리가 비었다. 대신들은 저마다 자신이 지지하는 인물을 천거하고 있다. 누구를 백관의 으뜸으로 세우느냐에 따라 조정의 분위기가 달라질 것이다."
 jfp_cab.1.f:0 "“노대감은 조정을 안정시킬 것이고, 젊은 판서는 일을 빨리 해낼 것이며, 개화당 사람은 나라를 바꿀 것입니다.”\n\n“그럼 그대는 누구를 천거하는가?”\n\n“소신은… 전하의 뜻을 따르겠사옵니다.”"
 jfp_cab.1.a:0 "노론의 원로 대신을 세운다."
 jfp_cab.1.b:0 "행정에 밝은 실무 관료를 세운다."
 jfp_cab.1.c:0 "개화파 인사를 과감히 등용한다."

 jfp_cab.2.t:0 "호조판서 천거"
 jfp_cab.2.d:0 "나라 살림을 맡을 호조판서를 새로 뽑아야 한다. 세금을 엄히 거둘 사람, 빚을 줄일 사람, 세제를 뜯어고칠 사람이 후보에 올랐다."
 jfp_cab.2.f:0 "호조의 낡은 장부 더미 앞에서 후보자 셋은 각기 다른 쪽을 펼쳤다. 하나는 세입을, 하나는 부채를, 하나는 백지를."
 jfp_cab.2.a:0 "세금을 빈틈없이 거둘 사람을 세운다."
 jfp_cab.2.b:0 "재정을 건전하게 꾸릴 사람을 세운다."
 jfp_cab.2.c:0 "세제를 근대화할 사람을 세운다."

 jfp_cab.3.t:0 "병조판서 천거"
 jfp_cab.3.d:0 "군권을 맡을 병조판서를 뽑아야 한다. 군적을 정비하자는 이, 방어를 굳히자는 이, 신식 군대를 만들자는 이가 맞서고 있다."
 jfp_cab.3.f:0 "“군사는 머릿수입니다.”\n\n“아니, 성벽입니다.”\n\n“둘 다 아닙니다. 총과 훈련입니다.”"
 jfp_cab.3.a:0 "군적을 정비할 사람을 세운다."
 jfp_cab.3.b:0 "방어를 중시하는 무장을 세운다."
 jfp_cab.3.c:0 "신식 군제를 아는 사람을 세운다."

 jfp_cab.4.t:0 "예조판서 천거"
 jfp_cab.4.d:0 "예조판서 자리를 두고 예법을 지키자는 유학자, 외교에 밝은 관료, 신식 교육을 주장하는 개화 인사가 후보에 올랐다."
 jfp_cab.4.f:0 "예조 마당의 향나무 아래에서 세 후보가 마주쳤다. 서로 고개만 까딱이고는 말 한마디 없이 지나쳤다."
 jfp_cab.4.a:0 "예법을 지킬 유학자를 세운다."
 jfp_cab.4.b:0 "외교에 밝은 관료를 세운다."
 jfp_cab.4.c:0 "신식 교육을 주장하는 인사를 세운다."

 jfp_cab.5.t:0 "공조판서 천거"
 jfp_cab.5.d:0 "공조판서 후보로 수리 사업에 밝은 사람, 토목 공사를 잘 아는 사람, 공장을 세우자는 사람이 올랐다."
 jfp_cab.5.f:0 "“보를 쌓으면 논이 살고, 길을 내면 장이 서고, 공장을 지으면….”\n\n“공장을 지으면?”\n\n“나라가 바뀝니다.”"
 jfp_cab.5.a:0 "수리 사업에 밝은 사람을 세운다."
 jfp_cab.5.b:0 "토목 공사를 잘 아는 사람을 세운다."
 jfp_cab.5.c:0 "식산흥업을 주장하는 사람을 세운다."

 # ─────────────── 류큐·대만·일본·만주 이벤트 ───────────────
 jfp_exp.1.t:0 "남쪽 바다의 왕국"
 jfp_exp.1.d:0 "류큐에서 표류민 송환을 계기로 사신이 왔다. 사신은 류큐가 청과 일본 사이에서 위태롭게 버티고 있다고 털어놓았다. 조선이 류큐를 보호한다면, 남쪽 바다는 조선의 바다가 될 것이다."
 jfp_exp.1.f:0 "류큐 사신이 바친 붉은 칠기 상자 안에는 류큐 왕의 국서와 함께 말린 사탕수수 한 묶음이 들어 있었다."
 jfp_exp.1.a:0 "남쪽에도 눈을 돌려야겠다."

 jfp_exp.2.t:0 "류큐의 새 종주국"
 jfp_exp.2.d:0 "류큐가 조선의 뜻을 따르게 되었다. 나하의 항구에 조선 상선이 드나들기 시작했고, 시선은 자연스레 더 남쪽의 큰 섬 대만으로 향한다."
 jfp_exp.2.f:0 "슈리성의 성벽 위에서 류큐의 대신이 북쪽 바다를 바라보았다. “이번 종주국은 부디 우리를 삼키지 않기를.”"
 jfp_exp.2.a:0 "이제 대만이다."

 jfp_exp.3.t:0 "류큐의 소멸"
 jfp_exp.3.d:0 "류큐 왕국이 다른 나라에 병합되어 사라졌다. 남쪽 바다로 나아갈 디딤돌을 잃었다."
 jfp_exp.3.f:0 "부산포에 닿은 류큐 상선은 낯선 깃발을 달고 있었다."
 jfp_exp.3.a:0 "한발 늦었다."

 jfp_exp.10.t:0 "대만의 새 주인"
 jfp_exp.10.d:0 "대만 전역이 조선의 손에 들어왔다. 평야의 사탕수수밭과 산지의 장뇌림은 이제 조선 경제의 새로운 원천이다."
 jfp_exp.10.f:0 "타이난 항구에 내린 조선 관리는 숨 막히는 더위에 갓끈을 풀었다. “여기서는 겨울에도 눈이 안 온다더군.”"
 jfp_exp.10.a:0 "남방 경영을 시작하라."

 jfp_exp.11.t:0 "산지의 저항"
 jfp_exp.11.d:0 "대만 산지의 원주민 부족이 조선 원정군의 보급로를 습격했다. 토벌하자면 비용이 들고, 내버려 두면 원정이 지친다."
 jfp_exp.11.f:0 "안개 낀 계곡에서 화살 한 대가 날아왔다. 병사들이 몸을 숙였을 때, 숲은 이미 고요했다."
 jfp_exp.11.a:0 "토벌대를 보내라."
 jfp_exp.11.b:0 "보급로만 지키며 버틴다."

 jfp_exp.20.t:0 "왜관을 넘어서"
 jfp_exp.20.d:0 "열강의 인정을 받은 조선에서, 이제는 일본의 항구도 조선에 열려야 한다는 목소리가 나온다. 수백 년 동안 부산 왜관에서 일방적으로 이어진 교역을 뒤집자는 것이다."
 jfp_exp.20.f:0 "“왜관은 우리 땅에 있는데, 어째서 우리 상선은 저들의 항구에 들어가지 못합니까?”"
 jfp_exp.20.a:0 "일본의 문을 두드린다."

 jfp_exp.21.t:0 "열린 일본의 항구"
 jfp_exp.21.d:0 "일본의 항구에 조선 상관이 세워지고 조선 상선이 자유롭게 드나들게 되었다. 바다 건너 교역의 주도권이 조선으로 넘어왔다."
 jfp_exp.21.f:0 "상관 앞에 내건 태극 문양 깃발을 보려고 항구 사람들이 몰려들었다. 아이 하나가 그 깃발을 손가락으로 따라 그렸다."
 jfp_exp.21.a:0 "바다는 이제 우리의 길이다."

 jfp_exp.22.t:0 "왜관 상인들의 반발"
 jfp_exp.22.d:0 "조선의 개항 요구에 반발한 일본 상인들이 부산 왜관에서 교역을 중단하겠다고 위협한다. 조선 상인들은 손실을 보전해 달라고 아우성이다."
 jfp_exp.22.f:0 "초량 왜관의 문이 굳게 닫혔다. 문 앞에 쌓인 인삼 짐짝 위로 장맛비가 내렸다."
 jfp_exp.22.a:0 "우리 상인의 손실을 보전해 준다."
 jfp_exp.22.b:0 "왜상 따위의 협박에 굴하지 않는다."

 jfp_exp.30.t:0 "강 건너의 땅"
 jfp_exp.30.d:0 "만주의 땅 일부가 조선의 손에 들어왔다. 강을 건넌 유민들의 마을이 곳곳에 있지만, 길도 성도 없는 황무지가 대부분이다. 이 땅을 어떻게 경영할 것인가."
 jfp_exp.30.f:0 "두만강을 건넌 늙은 농부가 처음 일군 밭에 콩을 심었다. “여기서는 땅 주인이 따로 없다더라. 일구는 사람이 임자지.”"
 jfp_exp.30.a:0 "만주 경영을 시작하라."

 jfp_exp.31.t:0 "뿌리내린 만주"
 jfp_exp.31.d:0 "이주민의 마을과 둔전, 철도와 수비대가 자리를 잡았다. 만주는 더 이상 변방이 아니라 조선의 또 다른 중심이다."
 jfp_exp.31.f:0 "간도의 장터에서 조선 말과 만주 말과 청나라 말이 뒤섞였다. 흥정은 세 나라 말로 하고, 셈은 조선 엽전으로 했다."
 jfp_exp.31.a:0 "북쪽의 기틀이 섰다."

 jfp_exp.32.t:0 "간도 경계 분쟁"
 jfp_exp.32.d:0 "간도의 경계를 두고 청나라 관리들과 조선 이주민 사이에 충돌이 일어났다. 이주민을 보호하자면 청과 마찰을 각오해야 한다."
 jfp_exp.32.f:0 "백두산 정계비 앞에서 양국 관리가 비문의 ‘토문(土門)’ 두 글자를 두고 반나절을 다투었다."
 jfp_exp.32.a:0 "이주민을 보호하라."
 jfp_exp.32.b:0 "분쟁을 키우지 마라."
