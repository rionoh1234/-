l_korean:
 # ─────────────── 세도정치 ───────────────
 jfp_sedo.1.t:0 "벼슬을 파는 나라"
 jfp_sedo.1.d:0 "지방 수령 자리가 공공연히 값이 매겨져 거래되고 있다. 돈을 주고 벼슬을 산 자들은 임지에 내려가 본전의 몇 곱절을 백성에게서 거둬들인다. 세도가의 문객들은 오히려 이것이 국고를 채우는 길이라 말한다."
 jfp_sedo.1.f:0 "“고을 하나에 오천 냥이라 하더이다.”\n\n“그 돈은 누가 갚소?”\n\n“누구긴 누구겠소. 그 고을 백성이지.”"
 jfp_sedo.1.a:0 "관직도 결국 나라의 재원이다."
 jfp_sedo.1.b:0 "벼슬을 사고판 자를 엄히 다스려라."
 jfp_sedo.1.c:0 "지금은 못 본 척하는 수밖에 없다."

 jfp_sedo.2.t:0 "외척의 인사"
 jfp_sedo.2.d:0 "비변사에서 올라온 인사안에 또다시 같은 가문의 이름이 줄지어 적혀 있다. 대비전에서는 이미 뜻을 정했다며 윤허를 재촉한다."
 jfp_sedo.2.f:0 "어전에 엎드린 대신들은 한결같이 고개를 숙이고 있었다. 누구도 먼저 입을 열지 않았다. 침묵이 곧 대답이었다."
 jfp_sedo.2.a:0 "윤허한다."
 jfp_sedo.2.b:0 "이 인사안은 받아들일 수 없다."

 jfp_sedo.3.t:0 "암행어사 출두요!"
 jfp_sedo.3.d:0 "민정을 살피러 내려간 암행어사가 한 고을 수령의 엄청난 비리를 적은 서계(書啓)를 올렸다. 그런데 그 수령은 조정 실력자의 가까운 친척이다."
 jfp_sedo.3.f:0 "“암행어사 출두야!”\n\n역졸들의 외침에 동헌 마당이 뒤집혔다. 잔칫상을 받던 사또는 갓도 제대로 쓰지 못한 채 툇마루 아래로 굴러떨어졌다."
 jfp_sedo.3.a:0 "봉고파직하라. 누구의 친척이든 상관없다."
 jfp_sedo.3.b:0 "서계를 조용히 덮어 두어라."

 jfp_sedo.4.t:0 "젊은 학자들"
 jfp_sedo.4.d:0 "과거에 갓 급제한 젊은 문신 몇이 세도가의 문하에 들기를 거부하고 임금께 직접 경연에 참여하기를 청했다. 이들을 곁에 두면 임금의 손발이 되겠지만, 원로 대신들은 불쾌해할 것이다."
 jfp_sedo.4.f:0 "“전하, 신들은 오직 전하의 신하이옵니다. 어느 대감 댁 사랑에도 드나든 적이 없사옵니다.”"
 jfp_sedo.4.a:0 "그대들을 초계문신으로 삼겠노라."
 jfp_sedo.4.b:0 "원로 대신들의 뜻을 따르겠다."

 jfp_sedo.5.t:0 "왕비 간택"
 jfp_sedo.5.d:0 "국혼을 앞두고 왕비 간택이 시작되었다. 어느 가문에서 왕비가 나오느냐에 따라 앞으로 수십 년의 권력 지형이 결정된다는 것은 누구나 아는 일이다."
 jfp_sedo.5.f:0 "삼간택 날, 처녀들이 줄지어 대궐 문을 들어섰다. 그러나 대궐 안의 노련한 이들은 처녀들의 얼굴보다 그 뒤에 선 아비들의 이름을 먼저 살폈다."
 jfp_sedo.5.a:0 "안동 김씨 가문에서 왕비를 맞이한다."
 jfp_sedo.5.b:0 "풍양 조씨 가문에서 왕비를 맞이한다."
 jfp_sedo.5.c:0 "세력 없는 한미한 가문에서 왕비를 맞이한다."

 jfp_sedo.6.t:0 "옥체 미령"
 jfp_sedo.6.d:0 "임금의 병환이 깊어지고 있다. 어의들은 연일 탕약을 올리지만 차도가 없다. 궐 밖에서는 벌써 다음 보위를 두고 수군거리는 소리가 들린다."
 jfp_sedo.6.f:0 "내의원의 불은 밤새 꺼지지 않았다. 약방 기생이 달이는 탕약 냄새가 희정당 처마 밑까지 스며들었다."
 jfp_sedo.6.a:0 "나라 안의 명의를 모두 불러들여라."
 jfp_sedo.6.b:0 "대비전께서 국정을 대신 살피시게 하라."

 jfp_sedo.7.t:0 "강화도령"
 jfp_sedo.7.d:0 "임금이 후사 없이 승하하였다. 대왕대비는 강화도에서 농사를 짓던 왕족 이원범을 새 임금으로 지목하였다. 학문도 정치도 배운 적 없는 그를 세우려는 것은, 세도가가 계속 국정을 쥐겠다는 뜻이다."
 jfp_sedo.7.f:0 "“나무하던 총각이 하루아침에 상감마마가 되었다네.”\n\n“그러니 누가 진짜 임금인지는 삼척동자도 알겠구먼.”"
 jfp_sedo.7.a:0 "대왕대비의 뜻을 받든다."
 jfp_sedo.7.b:0 "종친 가운데 장성하고 학문 있는 이를 세워야 한다."

 jfp_sedo.10.t:0 "친정(親政)"
 jfp_sedo.10.d:0 "마침내 외척의 손에서 국정을 되찾았다. 비변사의 인사권은 임금에게 돌아왔고, 세도가의 문객들은 하나둘 조정을 떠났다."
 jfp_sedo.10.f:0 "“오늘부터 모든 일은 과인이 친히 결재하겠노라.”\n\n편전에 앉은 대신들 가운데 몇은 얼굴이 하얗게 질렸고, 몇은 조용히 미소를 지었다."
 jfp_sedo.10.a:0 "임금이 임금다워야 나라가 선다."

 jfp_sedo.11.t:0 "굳어진 세도"
 jfp_sedo.11.d:0 "세월이 흘렀으나 외척의 권세는 꺾이지 않았다. 세도정치는 이제 하나의 관행이 되어 버렸고, 왕실의 권위는 땅에 떨어졌다."
 jfp_sedo.11.f:0 "“임금은 대궐에 계시고, 나라는 대감 댁 사랑방에 있다.” 장터에서 떠도는 말이었다."
 jfp_sedo.11.a:0 "언젠가는 바로잡을 날이 오리라."
