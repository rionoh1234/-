l_korean:
 # ─────────────── 서학과 천주교 ───────────────
 jfp_seohak.1.t:0 "국경을 넘은 이방인"
 jfp_seohak.1.d:0 "의주 국경을 몰래 넘어온 서양인 신부들이 상복 차림으로 얼굴을 가리고 신자들의 집에 숨어 지낸다는 첩보가 들어왔다. 파리외방전교회에서 보낸 자들이라 한다."
 jfp_seohak.1.f:0 "방갓을 깊이 눌러쓴 상주(喪主) 하나가 압록강 얼음 위를 건넜다. 그 갓 아래 얼굴이 이 땅 사람의 것이 아님을 아는 이는 길잡이 하나뿐이었다."
 jfp_seohak.1.a:0 "샅샅이 뒤져 잡아들여라."
 jfp_seohak.1.b:0 "당장은 조용히 지켜보기만 하라."

 jfp_seohak.2.t:0 "기해년의 박해"
 jfp_seohak.2.d:0 "조정 안에서 천주교를 엄히 다스려야 한다는 목소리가 높아졌다. 신자들을 잡아들이고, 숨어 있던 서양 신부들까지 체포하라는 상소가 잇따른다. 이번 결정은 앞으로 이 땅에서 서학이 설 자리를 가를 것이다."
 jfp_seohak.2.f:0 "“임금과 어버이를 모르고 제사를 끊는 무리를 그대로 두면, 삼강오륜이 무너지고 나라가 망할 것이옵니다!”\n\n상소를 올린 유생의 목소리가 대전 기둥을 울렸다."
 jfp_seohak.2.a:0 "척사윤음을 반포하고 사학을 엄금하라."
 jfp_seohak.2.b:0 "형벌은 거두고 교화로 다스리라."

 jfp_seohak.3.t:0 "조선인 신부"
 jfp_seohak.3.d:0 "마카오에서 공부하고 사제가 되어 돌아온 조선인 청년 김대건이 서해안에서 붙잡혔다. 그는 중국 어선을 통해 선교사들의 입국로를 마련하던 중이었으며, 여러 나라 말에 능하고 서양 지리에도 밝다고 한다."
 jfp_seohak.3.f:0 "옥중의 젊은이는 심문하던 관리들에게 세계 지도를 그려 보였다. 관리들은 그를 죽여야 할지, 써먹어야 할지 몰라 서로 눈치만 보았다."
 jfp_seohak.3.a:0 "국법대로 처형하라."
 jfp_seohak.3.b:0 "목숨만은 살려 국외로 내쫓아라."

 jfp_seohak.4.t:0 "병인년의 박해"
 jfp_seohak.4.d:0 "러시아의 남하를 막으려 프랑스 신부들을 이용하자는 구상이 틀어지자, 조정의 분위기가 급변했다. 서양 신부들과 수많은 신자를 처형하라는 주장이 거세다. 그러나 서양 신부를 죽이면 그 나라가 가만히 있지 않을 것이라는 경고도 있다."
 jfp_seohak.4.f:0 "새남터 모래사장에 또다시 형장이 차려졌다. 한강 건너편 언덕에 모인 구경꾼들은 말이 없었다."
 jfp_seohak.4.a:0 "서양 오랑캐와 그 무리를 모두 잡아 처형하라."
 jfp_seohak.4.b:0 "신부들은 국외로 추방하고 신자들은 훈방하라."

 jfp_seohak.5.t:0 "연경에서 온 책"
 jfp_seohak.5.d:0 "북경에 다녀온 사신단의 짐 속에서 한역(漢譯)된 서양 서적이 다수 발견되었다. 천문·역법·기하학·의학을 다룬 책들이지만, 그 사이사이에 천주교 교리서도 섞여 있다."
 jfp_seohak.5.f:0 "“이 책에 따르면 땅은 둥글고, 해가 아니라 땅이 돈다 하옵니다.”\n\n“해괴한 소리로다. 그런데… 그렇다면 일식은 어찌 맞히는가?”"
 jfp_seohak.5.a:0 "학문은 학문이다. 널리 읽게 하라."
 jfp_seohak.5.b:0 "사학의 씨앗이니 모두 불태워라."

 jfp_seohak.6.t:0 "산골의 교우촌"
 jfp_seohak.6.d:0 "깊은 산골에 신자들이 모여 옹기를 굽고 화전을 일구며 살아가는 마을이 발각되었다. 관헌의 눈을 피해 숨어든 이들이다."
 jfp_seohak.6.f:0 "포졸들이 마을에 들이닥쳤을 때, 사람들은 도망치지 않았다. 그들은 가마 앞에 모여 앉아 조용히 무언가를 읊조리고 있었다."
 jfp_seohak.6.a:0 "모두 잡아들여라."
 jfp_seohak.6.b:0 "가난한 화전민일 뿐이다. 그냥 두어라."

 jfp_seohak.9.t:0 "서학 논쟁의 결말"
 jfp_seohak.9.d:0 "서학을 둘러싼 오랜 논쟁이 일단락되었다. 조정이 걸어온 길은 이 나라가 바깥 세상을 어떻게 대할지에 대한 대답이기도 하다."
 jfp_seohak.9.f:0 "어느 늙은 선비가 일기에 적었다. “막는다고 막아지는 물이 아니다. 다만 그 물길을 어디로 낼지는 우리가 정할 수 있으리라.”"
 jfp_seohak.9.a:0 "정학(正學)을 지켜 냈다."
 jfp_seohak.9.b:0 "서양의 학문도 우리 것으로 삼으리라."
