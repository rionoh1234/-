l_korean:
 # ─────────────── 대업 캠페인: 도입과 단계 완료 ───────────────
 jfp_daeup.10.t:0 "대업(大業)"
 jfp_daeup.10.d:0 "조선은 청의 조공국으로서 새로운 세기를 맞았다. 서양의 배는 이미 동쪽 바다를 넘보고, 이웃 나라들은 저마다 살길을 찾고 있다. 언젠가 이 나라가 스스로 일어서 동아시아의 질서를 새로 쓸 날이 올 수 있을까. 길은 멀고 험하지만, 그 끝에 이른다면 누구도 넘보지 못할 나라가 될 것이다."
 jfp_daeup.10.f:0 "“먼 길을 가려는 자는 먼저 신발 끈을 맨다 했습니다.”\n\n“그 길이 어디까지인지 그대는 아는가?”\n\n“모르옵니다. 다만 멈추면 그곳이 끝일 것입니다.”"
 jfp_daeup.10.a:0 "천 리 길도 한 걸음부터다."

 jfp_daeup.1.t:0 "사슬을 끊다"
 jfp_daeup.1.d:0 "조선은 더 이상 누구의 조공국도 아니다. 연경으로 향하던 공물 수레는 멈추었고, 칙사를 맞이하던 영은문 앞에는 이제 새로운 문이 세워질 것이다."
 jfp_daeup.1.f:0 "영은문의 주춧돌이 뽑혀 나가던 날, 구경 나온 노인 하나가 지팡이를 짚고 한참을 서 있었다. “내 평생 이 문 앞에서 고개 숙이는 것만 보았는데….”"
 jfp_daeup.1.a:0 "이제부터가 시작이다."

 jfp_daeup.2.t:0 "열강의 반열에"
 jfp_daeup.2.d:0 "철도가 놓이고 공장이 돌아가며, 신식 군대가 국경을 지킨다. 열강은 조선을 대등한 나라로 인정했고, 바다 건너 일본도 이제 조선을 얕보지 못한다. 시선은 자연스레 북쪽, 압록강 너머로 향한다."
 jfp_daeup.2.f:0 "“만주 땅을 다녀온 상인 말이, 그곳 개간지마다 조선 말이 들린다 합니다.”\n\n“그렇다면 그 땅은 이미 반쯤 우리 것이로군.”"
 jfp_daeup.2.a:0 "북쪽을 바라보라."

 jfp_daeup.3.t:0 "고구려의 땅"
 jfp_daeup.3.d:0 "요동과 길림의 들판에 조선의 깃발이 올랐다. 광개토왕의 비석이 서 있는 땅이 천 년 만에 다시 이 나라의 강역이 되었다."
 jfp_daeup.3.f:0 "국내성 옛터에 선 장수가 말없이 이끼 낀 비석을 쓸어내렸다. 그 위에 새겨진 글자들은 천 년의 비바람에도 지워지지 않았다."
 jfp_daeup.3.a:0 "옛 강역이 돌아왔다."

 jfp_daeup.4.t:0 "새로운 질서"
 jfp_daeup.4.d:0 "청과 일본이 모두 조선의 뜻을 따르게 되었다. 수백 년 동안 이어진 동아시아의 질서가 뒤집혔다. 서양 열강의 신문들은 ‘은자의 나라’가 동방의 패자가 되었다고 대서특필한다."
 jfp_daeup.4.f:0 "북경의 자금성과 도쿄의 궁성에서 온 사절이 나란히 경복궁 근정전 앞에 섰다. 백 년 전이라면 누구도 상상하지 못했을 광경이었다."
 jfp_daeup.4.a:0 "이제 마지막 장을 쓸 차례다."

 jfp_daeup.5.t:0 "대동아 공영권"
 jfp_daeup.5.d:0 "동아시아와 동남아시아의 모든 나라가 조선이 이끄는 공영권 아래 하나가 되었고, 이 땅에서 서양 열강의 거점은 모두 사라졌다. 강화도의 작은 포대에서 시작된 저항은 마침내 한 시대의 질서가 되었다."
 jfp_daeup.5.f:0 "한양의 대로를 따라 수십 나라의 깃발이 나부꼈다. 행렬을 지켜보던 늙은 군인이 옆의 손자에게 속삭였다. “저 끝에 걸린 깃발이 보이느냐. 할아비가 젊었을 적에는 저 나라들 이름도 몰랐단다.”"
 jfp_daeup.5.a:0 "무력으로 지킨 질서는 무력으로 유지한다."
 jfp_daeup.5.b:0 "학문과 교역으로 공영의 기틀을 다진다."

 # ─────────────── 1단계 역경 ───────────────
 jfp_daeup.101.t:0 "늘어난 공물"
 jfp_daeup.101.d:0 "종주국이 올해부터 공물의 양을 크게 늘리라고 통보해 왔다. 거절한다면 종주국과의 관계는 크게 틀어질 것이다."
 jfp_daeup.101.f:0 "호조판서가 장부를 덮으며 한숨을 쉬었다. “이대로라면 내년 봄 군량부터 모자랄 것이옵니다.”"
 jfp_daeup.101.a:0 "어쩔 수 없다. 요구를 들어주어라."
 jfp_daeup.101.b:0 "더는 못 바친다고 전하라."

 jfp_daeup.102.t:0 "칙사의 행차"
 jfp_daeup.102.d:0 "종주국의 칙사가 한양에 도착했다. 관례대로라면 임금이 친히 성문 밖까지 나가 예를 갖추어야 한다. 칙사는 벌써부터 접대가 소홀하다며 트집을 잡고 있다."
 jfp_daeup.102.f:0 "모화관 앞에 꿇어앉은 대신들의 무릎이 언 땅에 시렸다. 가마에서 내린 칙사는 그들을 내려다보며 천천히 부채를 폈다."
 jfp_daeup.102.a:0 "관례대로 예를 갖추어라."
 jfp_daeup.102.b:0 "영접 의례를 낮추어라. 조선도 한 나라다."

 jfp_daeup.103.t:0 "사대의 명분"
 jfp_daeup.103.d:0 "조정의 원로 대신들이 종주국과의 관계를 해쳐서는 안 된다며 자주를 주장하는 젊은 관료들을 탄핵하고 나섰다. 대의명분을 앞세운 그들의 목소리는 결코 작지 않다."
 jfp_daeup.103.f:0 "“사대는 작은 나라가 큰 나라를 섬기는 예이며, 이 나라를 지켜 온 근본이옵니다!”\n\n“그 근본이 우리를 지켜 준 적이 한 번이라도 있었소?”"
 jfp_daeup.103.a:0 "사대파를 조정에서 몰아내라."
 jfp_daeup.103.b:0 "그들과 타협하여 조정을 안정시킨다."

 # ─────────────── 2단계 역경 ───────────────
 jfp_daeup.201.t:0 "이권의 유혹"
 jfp_daeup.201.d:0 "열강의 공사관이 광산 채굴권을 내주면 근대화 자금을 대 주겠다고 제안한다. 당장의 돈은 달지만, 한번 내준 이권은 되찾기 어렵다."
 jfp_daeup.201.f:0 "“금광 하나면 철도 백 리를 놓을 수 있습니다.”\n\n“그 철도로 실어 나를 금은 누구 것이 되는가?”"
 jfp_daeup.201.a:0 "이권을 내주고 자금을 받는다."
 jfp_daeup.201.b:0 "우리 돈으로 하겠다. 거절하라."

 jfp_daeup.202.t:0 "정한론"
 jfp_daeup.202.d:0 "일본 조정에서 조선을 정벌해야 한다는 주장이 다시 고개를 들고 있다. 대마도 근해에서 일본 군함의 움직임도 잦아졌다."
 jfp_daeup.202.f:0 "부산포의 어부들이 수평선을 가리켰다. 연기를 뿜는 검은 배 세 척이 천천히 섬 사이를 지나가고 있었다."
 jfp_daeup.202.a:0 "남해안 방비를 강화하라."
 jfp_daeup.202.b:0 "사신을 보내 외교로 무마하라."

 jfp_daeup.203.t:0 "외국 차관"
 jfp_daeup.203.d:0 "근대화 사업에 들어갈 돈이 턱없이 모자란다. 외국 은행이 거액의 차관을 제안하지만 조건이 까다롭다. 거절한다면 그만큼 백성에게서 더 거두어야 한다."
 jfp_daeup.203.f:0 "런던에서 온 은행가는 계약서의 이자율 칸을 손가락으로 툭툭 쳤다. 통역관은 그 숫자를 옮기기를 잠시 망설였다."
 jfp_daeup.203.a:0 "차관을 들여오라."
 jfp_daeup.203.b:0 "허리띠를 졸라맨다."

 # ─────────────── 3단계 역경 ───────────────
 jfp_daeup.301.t:0 "북쪽의 곰"
 jfp_daeup.301.d:0 "러시아가 연해주와 흑룡강 일대에 병력을 늘리고 있다. 조선의 북진을 경계하는 것이 분명하다."
 jfp_daeup.301.f:0 "두만강 건너편 언덕에 러시아 기병대의 초소가 새로 생겼다. 밤마다 그쪽에서 낯선 노랫소리가 강을 건너왔다."
 jfp_daeup.301.a:0 "국경 수비대를 증강하라."
 jfp_daeup.301.b:0 "러시아와의 마찰을 피하라."

 jfp_daeup.302.t:0 "열강의 간섭"
 jfp_daeup.302.d:0 "조선의 북진에 위협을 느낀 열강이 공동으로 압력을 넣어 왔다. 점령지에서 물러나지 않으면 좌시하지 않겠다는 것이다."
 jfp_daeup.302.f:0 "세 나라 공사가 한꺼번에 외부(外部)를 찾았다. 그들은 같은 내용의 문서를 같은 순서로 내려놓았다."
 jfp_daeup.302.a:0 "지금은 물러설 수밖에 없다."
 jfp_daeup.302.b:0 "한 치도 물러서지 않는다."

 jfp_daeup.303.t:0 "마적 떼"
 jfp_daeup.303.d:0 "만주 벌판에 마적 떼가 들끓어 개간민의 마을을 습격하고 교역로를 끊고 있다."
 jfp_daeup.303.f:0 "불탄 마을 어귀에서 개간민 하나가 무너진 담장을 다시 쌓고 있었다. “고향을 떠나 여기까지 왔는데, 또 어디로 가란 말이오.”"
 jfp_daeup.303.a:0 "토벌대를 보내라."
 jfp_daeup.303.b:0 "군대는 더 중요한 곳에 써야 한다."

 # ─────────────── 4단계 역경 ───────────────
 jfp_daeup.401.t:0 "포위망"
 jfp_daeup.401.d:0 "서양 열강이 조선의 팽창을 막기 위해 서로 손을 잡고 있다는 첩보가 들어왔다. 군비를 늘려 맞설 것인가, 한발 물러설 것인가."
 jfp_daeup.401.f:0 "“그들이 두려워한다는 것은, 우리가 옳은 길을 가고 있다는 뜻이오.”\n\n“두려움은 때로 칼이 되어 돌아옵니다, 대감.”"
 jfp_daeup.401.a:0 "군비를 늘려 맞선다."
 jfp_daeup.401.b:0 "외교적으로 양보한다."

 jfp_daeup.402.t:0 "저항의 불씨"
 jfp_daeup.402.d:0 "조선의 지배에 반발하는 저항 운동이 곳곳에서 일어나고 있다. 무력으로 누를 수도 있지만, 그 대가는 결코 작지 않을 것이다."
 jfp_daeup.402.f:0 "벽에 붙은 격문은 밤새 누군가가 붙이고, 아침이면 순검들이 떼어 냈다. 다음 날 밤이면 다시 붙었다."
 jfp_daeup.402.a:0 "단호히 진압하라."
 jfp_daeup.402.b:0 "회유책을 쓰고 군의 강경파를 누른다."

 jfp_daeup.403.t:0 "끝나지 않는 원정"
 jfp_daeup.403.d:0 "장기간의 원정으로 병사들이 지쳐 가고 있다. 군 지휘부는 원정을 계속해야 한다고 주장하지만, 고향의 가족들은 아들이 돌아오기만을 기다린다."
 jfp_daeup.403.f:0 "막사 안에서 편지를 읽던 병사가 종이를 꼭 접어 품에 넣었다. “어머니가 올해 보리는 잘 여물었다 하시네.”"
 jfp_daeup.403.a:0 "대업을 위해 원정을 계속한다."
 jfp_daeup.403.b:0 "병사들을 쉬게 하라."

 # ─────────────── 5단계 역경 ───────────────
 jfp_daeup.501.t:0 "가맹국의 반발"
 jfp_daeup.501.d:0 "공영권의 일부 가맹국이 맹주의 요구가 지나치다며 반발하고 있다. 강하게 누르면 결속이 흔들리고, 달래자면 막대한 돈이 든다."
 jfp_daeup.501.f:0 "“공영(共榮)이라 하였으나, 영화를 누리는 것은 한양뿐 아니오?”\n\n회의장에 그 말이 울리자 잠시 정적이 흘렀다."
 jfp_daeup.501.a:0 "맹주의 권위로 누른다."
 jfp_daeup.501.b:0 "원조를 늘려 달랜다."

 jfp_daeup.502.t:0 "서양의 반격"
 jfp_daeup.502.d:0 "동아시아의 마지막 거점마저 잃을 위기에 처한 서양 열강이 대규모 함대를 파견하겠다고 위협하고 있다."
 jfp_daeup.502.f:0 "제물포 앞바다의 수평선에 회색 연기가 줄지어 피어올랐다. 해안 포대의 포수들은 말없이 포탄을 옮겼다."
 jfp_daeup.502.a:0 "전국의 힘을 모아 맞선다."
 jfp_daeup.502.b:0 "일단 양보하고 때를 기다린다."

 jfp_daeup.503.t:0 "맹주의 의무"
 jfp_daeup.503.d:0 "흉년이 든 가맹국들이 맹주에게 구휼을 요청하고 있다. 외면한다면 공영권의 명분이 흔들릴 것이다."
 jfp_daeup.503.f:0 "“맹주란 앞장서 거두는 자가 아니라 앞장서 내어 주는 자입니다.” 늙은 정승의 말에 젊은 대신들은 아무도 대꾸하지 않았다."
 jfp_daeup.503.a:0 "곳간을 열어 구휼하라."
 jfp_daeup.503.b:0 "우리 백성이 먼저다."
