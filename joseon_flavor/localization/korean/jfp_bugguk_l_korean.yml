l_korean:
 # ─────────────── 툴팁 ───────────────
 jfp_tt_daeup_2_sectors:0 "#v 부국강병 분과 개혁#!(군제·경제·사회) 가운데 2개 이상 완료"
 jfp_tt_bugguk_sector_count:0 "완료한 #v 부국강병 분과#!가 하나 늘어납니다."
 jfp_tt_bugguk_recognition:0 "#v 열강의 인정#! 저널이 진행 중이면 진행도가 #G 40#! 오릅니다."
 jfp_tt_qing_unity_down:0 "#v 청#!의 #v 통합도#!가 #R 1#! 떨어집니다 (청의 통합 위기 저널이 진행 중일 때)."
 jfp_tt_bugguk_military_actions:0 "개혁 조치 #v 무위영 창설·무관학교 설립·징병 규정 반포#!를 모두 시행함"
 jfp_tt_bugguk_economy_actions:0 "개혁 조치 #v 도량형 통일·국립은행 설립·회사 장정 반포#!를 모두 시행함"
 jfp_tt_bugguk_society_actions:0 "개혁 조치 #v 교육 조서 반포·신분제 혁파·태양력 채택#!을 모두 시행함"
 jfp_tt_bugguk_arms_industry:0 "#v 무기 공장#! 3단계 이상인 주가 있음"
 jfp_tt_bugguk_railways:0 "편입된 주의 #v 절반 이상#!에 철도가 있음"
 jfp_tt_bugguk_university:0 "#v 대학#! 3단계 이상인 주가 있음"

 # ─────────────── 저널 ───────────────
 je_jfp_bugguk_military:0 "부국강병: 군제 개혁"
 je_jfp_bugguk_military_reason:0 "활과 화승총에 기대던 군영으로는 열강의 군대를 막을 수 없다. 상비군을 세우고, 장교를 기르고, 병기를 스스로 만들어야 한다.\n\n분과 개혁을 완료하면 #b 열강의 인정#! 진행도가 오르고, 대업 2단계 조건(분과 2개 이상)에 반영된다."
 je_jfp_bugguk_economy:0 "부국강병: 경제 개혁"
 je_jfp_bugguk_economy_reason:0 "강한 군대는 튼튼한 재정 위에서만 선다. 도량형을 하나로 맞추고, 은행을 세우고, 철도로 나라를 이어야 한다.\n\n분과 개혁을 완료하면 #b 열강의 인정#! 진행도가 오르고, 대업 2단계 조건(분과 2개 이상)에 반영된다."
 je_jfp_bugguk_society:0 "부국강병: 사회 개혁"
 je_jfp_bugguk_society_reason:0 "새 나라를 움직일 사람은 새 학교에서 나온다. 배움을 넓히고, 신분의 굴레를 풀고, 세계와 같은 달력을 써야 한다.\n\n분과 개혁을 완료하면 #b 열강의 인정#! 진행도가 오르고, 대업 2단계 조건(분과 2개 이상)에 반영된다."

 # ─────────────── 버튼 ───────────────
 jfp_button_muwiyeong:0 "무위영 창설"
 jfp_button_muwiyeong_desc:0 "흩어진 군영을 하나로 묶어 상비 정예군을 만든다."
 jfp_button_military_academy:0 "무관학교 설립"
 jfp_button_military_academy_desc:0 "신식 전술과 병학을 가르치는 장교 양성 학교를 연다."
 jfp_button_conscription_law:0 "징병 규정 반포"
 jfp_button_conscription_law_desc:0 "신분에 관계없이 장정을 고르게 뽑는 병역 규정을 반포한다. 농민들의 반발이 있을 것이다."
 jfp_button_weights_measures:0 "도량형 통일"
 jfp_button_weights_measures_desc:0 "고을마다 다른 자와 되와 저울을 하나의 기준으로 맞춘다."
 jfp_button_national_bank:0 "국립은행 설립"
 jfp_button_national_bank_desc:0 "나라의 돈줄을 관리할 중앙 은행을 세운다."
 jfp_button_company_charter:0 "회사 장정 반포"
 jfp_button_company_charter_desc:0 "상인들이 자본을 모아 회사를 세울 수 있도록 법규를 마련한다."
 jfp_button_education_edict:0 "교육 조서 반포"
 jfp_button_education_edict_desc:0 "국가의 근본은 교육에 있음을 선포하고 신식 학교를 세운다."
 jfp_button_abolish_status:0 "신분제 혁파"
 jfp_button_abolish_status_desc:0 "공사노비를 혁파하고 반상의 구별을 없앤다. 양반층이 크게 반발할 것이다."
 jfp_button_solar_calendar:0 "태양력 채택"
 jfp_button_solar_calendar_desc:0 "음력 대신 세계가 쓰는 태양력을 공식 역법으로 채택한다."

 # ─────────────── 수정자 ───────────────
 jfp_bugguk_reform_burden:0 "개혁의 부담"
 jfp_bugguk_reform_burden_desc:0 "동시에 여러 개혁을 추진하느라 관료 조직이 과부하에 걸렸다."
 jfp_bugguk_muwiyeong:0 "무위영"
 jfp_bugguk_muwiyeong_desc:0 "상비 정예군이 수도와 요충지를 지킨다."
 jfp_bugguk_military_academy:0 "무관학교"
 jfp_bugguk_military_academy_desc:0 "신식 장교들이 군을 이끈다."
 jfp_bugguk_conscription_law:0 "징병 규정"
 jfp_bugguk_conscription_law_desc:0 "고른 병역으로 더 많은 장정을 모을 수 있다."
 jfp_bugguk_weights_measures:0 "통일된 도량형"
 jfp_bugguk_weights_measures_desc:0 "같은 기준으로 거래하니 상업과 생산이 원활하다."
 jfp_bugguk_national_bank:0 "국립은행"
 jfp_bugguk_national_bank_desc:0 "중앙 은행이 낮은 이자로 자금을 공급한다."
 jfp_bugguk_company_charter:0 "회사 장정"
 jfp_bugguk_company_charter_desc:0 "근대적 회사들이 제조업을 이끈다."
 jfp_bugguk_education_edict:0 "교육 조서"
 jfp_bugguk_education_edict_desc:0 "신식 학교가 곳곳에 세워지고 있다."
 jfp_bugguk_abolish_slavery_status:0 "신분제 혁파"
 jfp_bugguk_abolish_slavery_status_desc:0 "신분의 굴레에서 풀려난 백성들이 새로운 일을 찾아 나선다."
 jfp_bugguk_solar_calendar:0 "태양력"
 jfp_bugguk_solar_calendar_desc:0 "세계와 같은 달력을 쓰니 교류가 수월해졌다."
 jfp_bugguk_military_done:0 "군제 개혁 완수"
 jfp_bugguk_military_done_desc:0 "근대식 군대가 완성되었다."
 jfp_bugguk_economy_done:0 "경제 개혁 완수"
 jfp_bugguk_economy_done_desc:0 "근대적 경제 제도가 자리 잡았다."
 jfp_bugguk_society_done:0 "사회 개혁 완수"
 jfp_bugguk_society_done_desc:0 "새 교육을 받은 세대가 나라를 이끌기 시작했다."

 # ─────────────── 이벤트 ───────────────
 jfp_bugguk.1.t:0 "새로운 군대"
 jfp_bugguk.1.d:0 "상비군과 장교단, 무기 공장이 모두 갖추어졌다. 열강의 무관들도 조선군의 열병식을 보고 고개를 끄덕인다."
 jfp_bugguk.1.f:0 "“앞으로 가!” 구령에 맞춰 수천 개의 군화가 한꺼번에 땅을 울렸다. 사열대 위의 늙은 무장은 조용히 눈을 감았다. 그가 젊었을 때 들은 것은 북과 나팔 소리뿐이었다."
 jfp_bugguk.1.a:0 "이 군대로 나라를 지킨다."
 jfp_bugguk.2.t:0 "돈이 도는 나라"
 jfp_bugguk.2.d:0 "철도가 나라 곳곳을 잇고, 은행과 회사가 자금을 돌린다. 장시의 상인들은 이제 엽전 꾸러미 대신 어음을 주고받는다."
 jfp_bugguk.2.f:0 "“한양에서 부산까지 사흘이면 간다더군.”\n\n“사흘? 내 아버지는 보름을 걸었네.”"
 jfp_bugguk.2.a:0 "부국의 기틀이 섰다."
 jfp_bugguk.3.t:0 "새 학교의 아이들"
 jfp_bugguk.3.d:0 "신식 학교와 대학이 세워지고, 신분의 굴레가 풀렸다. 양반의 자제와 상민의 자식이 한 교실에서 같은 책을 읽는다."
 jfp_bugguk.3.f:0 "교실 맨 앞줄에 앉은 백정의 아들이 손을 번쩍 들었다. 교사는 잠시 망설이다가, 웃으며 그를 지목했다."
 jfp_bugguk.3.a:0 "사람이 곧 나라의 힘이다."
