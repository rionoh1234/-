l_korean:
 # ─────────────── 삼정의 문란 ───────────────
 jfp_samjeong.1.t:0 "봄에 꾸고 가을에 갚고"
 jfp_samjeong.1.d:0 "환곡은 본래 춘궁기에 곡식을 빌려주고 가을에 돌려받는 구휼 제도였다. 그러나 이제 아전들은 겨와 모래를 섞어 빌려주고, 가을이면 높은 이자를 붙여 거둬들인다. 빌리지 않은 이에게까지 억지로 떠넘기는 일도 흔하다."
 jfp_samjeong.1.f:0 "“한 섬을 꾸었는데 받아 보니 반이 쭉정이였소. 그런데 갚을 때는 한 섬 반을 내라니, 이게 어디 나라 곡식이오, 고리대금이지.”"
 jfp_samjeong.1.a:0 "국고로 묵은 빚을 덜어 주어라."
 jfp_samjeong.1.b:0 "환곡 이자도 엄연한 국가 수입이다."

 jfp_samjeong.2.t:0 "백골징포"
 jfp_samjeong.2.d:0 "군적에는 이미 죽은 사람과 갓 태어난 아이의 이름까지 올라 있고, 그 몫의 군포가 살아 있는 가족에게 매겨진다. 도망간 이웃의 몫을 대신 무는 인징(隣徵)과 친척의 몫을 무는 족징(族徵)도 끊이지 않는다."
 jfp_samjeong.2.f:0 "늙은 아낙이 관아 앞에 주저앉아 울었다. 지난해 땅에 묻은 지아비와, 아직 이름도 짓지 못한 손자의 군포를 내라는 통지서를 손에 쥔 채였다."
 jfp_samjeong.2.a:0 "군적을 다시 정리하라."
 jfp_samjeong.2.b:0 "군포가 줄면 군대를 어찌 유지하겠는가."

 jfp_samjeong.3.t:0 "장부에 없는 땅"
 jfp_samjeong.3.d:0 "어느 고을의 실제 경작지가 양안(量案)에 적힌 것보다 훨씬 넓다는 보고가 올라왔다. 장부에서 빠진 은결(隱結)은 대개 힘 있는 양반가나 아전들의 몫이다."
 jfp_samjeong.3.f:0 "“이 논은 장부에 없는 땅이라 세금이 없습니다요.”\n\n“그럼 이 땅 주인은 누구냐?”\n\n아전은 대답 대신 먼 산의 기와집을 바라보았다."
 jfp_samjeong.3.a:0 "은결을 모조리 찾아내 세금을 매겨라."
 jfp_samjeong.3.b:0 "지방 사족들과 척을 질 수는 없다."

 jfp_samjeong.4.t:0 "보릿고개"
 jfp_samjeong.4.d:0 "가뭄과 냉해가 겹쳐 흉년이 들었다. 봄이 오기도 전에 곳간이 비고, 초근목피로 연명하는 백성들이 길가에 쓰러지고 있다."
 jfp_samjeong.4.f:0 "고갯마루를 넘는 유랑민의 행렬이 끝없이 이어졌다. 어린아이를 업은 어미가 소나무 껍질을 벗겨 입에 넣었다."
 jfp_samjeong.4.a:0 "진휼청을 열어 곡식을 풀어라."
 jfp_samjeong.4.b:0 "나라 곳간도 비었다. 각자 살길을 찾게 하라."

 jfp_samjeong.5.t:0 "탐관오리"
 jfp_samjeong.5.d:0 "한 수령이 결세를 부풀려 거두고 환곡을 빼돌린 사실이 드러났다. 그는 처벌을 면하려고 조정에 막대한 뇌물을 바치겠다고 한다."
 jfp_samjeong.5.f:0 "“금준미주(金樽美酒)는 천인혈(千人血)이요, 옥반가효(玉盤佳肴)는 만성고(萬姓膏)라.”\n\n— 「춘향전」 중 어사의 시"
 jfp_samjeong.5.a:0 "본보기로 엄벌하라."
 jfp_samjeong.5.b:0 "바친다는 것을 받고 덮어 두어라."

 jfp_samjeong.6.t:0 "임술년의 민란"
 jfp_samjeong.6.d:0 "진주에서 시작된 농민 봉기가 삼남 지방 전역으로 번지고 있다. 성난 농민들은 관아를 습격하고 아전들의 집을 불태웠다. 그들이 요구하는 것은 단 하나, 삼정의 폐단을 바로잡으라는 것이다."
 jfp_samjeong.6.f:0 "흰 수건을 머리에 동여맨 농민들이 죽창을 들고 읍내로 몰려들었다. 그들이 부르는 노래는 단순했다. 환곡을 없애라, 결세를 줄여라, 탐관오리를 내쫓아라."
 jfp_samjeong.6.a:0 "삼정이정청을 설치하여 근본을 바로잡겠다."
 jfp_samjeong.6.b:0 "안핵사를 보내 주동자만 처벌하라."
 jfp_samjeong.6.c:0 "군대를 보내 진압하라."

 jfp_samjeong.7.t:0 "삼정 이정"
 jfp_samjeong.7.d:0 "오랜 노력 끝에 전정·군정·환곡의 폐단이 상당 부분 바로잡혔다. 세금이 제대로 걷히고, 백성의 원성도 잦아들었다."
 jfp_samjeong.7.f:0 "“올해는 군포 통지서가 한 장만 왔다네.”\n\n“한 장이면 됐지. 산 사람 몫만 내면 되니.”"
 jfp_samjeong.7.a:0 "백성이 근본이니, 근본이 튼튼해야 나라가 편하다."
