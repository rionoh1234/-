l_korean:
 # ─────────────── 개항과 개화 ───────────────
 jfp_gaehwa.1.t:0 "강화도의 담판"
 jfp_gaehwa.1.d:0 "강화도 앞바다에 나타난 일본 군함이 포격전을 벌인 뒤, 일본은 그 책임을 물으며 함대를 이끌고 와 수호 조약 체결을 요구하고 있다. 조약안에는 항구 개방과 해안 측량, 그리고 자국민에 대한 영사 재판권이 담겨 있다."
 jfp_gaehwa.1.f:0 "연무당 대청에 마주 앉은 양측 대표 사이로 조약문이 오갔다. 조선 측 대신은 한 글자 한 글자를 손가락으로 짚어 가며 읽었지만, 그 문장들이 앞으로 무엇을 뜻하게 될지는 아무도 다 알지 못했다."
 jfp_gaehwa.1.a:0 "조약을 체결하고 항구를 연다."
 jfp_gaehwa.1.b:0 "끝까지 거부한다. 왜양일체(倭洋一體)일 뿐이다."

 jfp_gaehwa.2.t:0 "스스로 연 문"
 jfp_gaehwa.2.d:0 "우리는 이미 외국과의 교역을 허용했다. 강요에 의해서가 아니라 스스로의 판단으로 문을 연 만큼, 이제 그 문을 통해 무엇을 받아들일지 정해야 한다."
 jfp_gaehwa.2.f:0 "제물포 부두에 첫 외국 상선이 닻을 내렸다. 구경 나온 아이들이 굴뚝에서 피어오르는 검은 연기를 신기한 듯 올려다보았다."
 jfp_gaehwa.2.a:0 "개화의 길로 나아가자."

 jfp_gaehwa.3.t:0 "바다 건너의 견문"
 jfp_gaehwa.3.d:0 "일본에 사절단을 보내 그들의 개혁 상황을 살펴보자는 건의가 올라왔다. 사절단이 돌아오면 새로운 제도와 문물에 관한 견문을 전해 줄 것이다."
 jfp_gaehwa.3.f:0 "돌아온 수신사는 보따리에서 얇은 책자 하나를 꺼내 올렸다. “청국 외교관이 전해 준 글이옵니다. 러시아를 막으려면 중국과 친하고, 일본과 맺고, 미국과 연합하라 하였사옵니다.”"
 jfp_gaehwa.3.a:0 "사절단을 보내라."
 jfp_gaehwa.3.b:0 "왜국에서 배울 것은 없다."

 jfp_gaehwa.4.t:0 "만 명의 상소"
 jfp_gaehwa.4.d:0 "영남 유생 만여 명이 연명하여 개화 정책을 규탄하는 상소를 올렸다. 그들은 서양 및 일본과 가까이하자는 주장을 펴는 책자를 불태우고, 이를 들여온 관리를 처벌하라고 요구한다."
 jfp_gaehwa.4.f:0 "상소문은 펼치면 대전 마루 끝에서 끝까지 닿을 만큼 길었다. 그 끝에 적힌 이름들은 하나같이 먹이 진했다."
 jfp_gaehwa.4.a:0 "상소를 물리치고 주동자를 처벌하라."
 jfp_gaehwa.4.b:0 "유림의 뜻을 무시할 수 없다."

 jfp_gaehwa.5.t:0 "모래 섞인 녹봉"
 jfp_gaehwa.5.d:0 "열세 달이나 밀린 급료로 겨우 한 달 치 쌀이 지급되었는데, 그마저 겨와 모래가 섞여 있었다. 분노한 구식 군인들이 선혜청을 습격하고 별기군의 일본인 교관을 살해했다. 난병들은 대원군에게 몰려가 도움을 청하고 있다."
 jfp_gaehwa.5.f:0 "“우리가 굶는 동안 신식 군대는 흰쌀밥을 먹었다!”\n\n군졸 하나가 쌀가마를 칼로 찢자, 바닥에 쏟아진 것은 쌀보다 모래가 더 많았다."
 jfp_gaehwa.5.a:0 "밀린 급료를 모두 지급하여 난병을 달래라."
 jfp_gaehwa.5.b:0 "청나라 군대에 진압을 요청하라."
 jfp_gaehwa.5.c:0 "대원군의 재집권을 허락한다."

 jfp_gaehwa.6.t:0 "우정총국의 불길"
 jfp_gaehwa.6.d:0 "우정총국 낙성 축하연에서 불길이 치솟았다. 김옥균을 비롯한 급진 개화파가 정변을 일으켜 수구파 대신들을 제거하고 새 정부를 세우려 하고 있다. 그들은 일본 공사관 병력의 지원을 약속받았다고 한다."
 jfp_gaehwa.6.f:0 "“불이야!”\n\n그 외침이 신호였다. 연회장의 촛불이 흔들리는 사이, 칼을 든 그림자들이 문을 박차고 들어왔다."
 jfp_gaehwa.6.a:0 "개화당을 지지한다."
 jfp_gaehwa.6.b:0 "정변을 진압하라."

 jfp_gaehwa.7.t:0 "거문도의 깃발"
 jfp_gaehwa.7.d:0 "영국 함대가 남해의 거문도를 무단으로 점령하고 포대를 쌓기 시작했다. 러시아의 남하를 막기 위한 조치라고 하지만, 엄연한 우리 영토를 아무런 통보 없이 차지한 것이다."
 jfp_gaehwa.7.f:0 "섬 주민들은 낯선 깃발이 꽂힌 언덕을 올려다보았다. 고깃배를 띄워야 할 포구에는 회색 군함이 버티고 있었다."
 jfp_gaehwa.7.a:0 "엄중히 항의하고 철수를 요구하라."
 jfp_gaehwa.7.b:0 "열강끼리의 다툼이다. 일단 지켜보자."

 jfp_gaehwa.8.t:0 "곡식을 막아라"
 jfp_gaehwa.8.d:0 "흉년이 들었는데도 일본 상인들이 곡물을 대량으로 사들여 반출하는 바람에 곡물 값이 폭등했다. 지방관이 곡물의 반출을 금지하는 방곡령을 내리자, 일본은 조약 위반이라며 배상을 요구할 태세다."
 jfp_gaehwa.8.f:0 "“우리 먹을 쌀도 없는데 배에 실어 바다 건너로 보낸다니, 이게 무슨 해괴한 장사요!”"
 jfp_gaehwa.8.a:0 "방곡령을 시행한다. 백성이 먼저다."
 jfp_gaehwa.8.b:0 "조약을 지켜야 한다. 방곡령을 철회하라."

 jfp_gaehwa.10.t:0 "번역된 세계"
 jfp_gaehwa.10.d:0 "젊은 관료와 유학생들이 서양의 정치·경제·법률 서적을 번역해 보급하자고 건의한다. 바깥 세상을 알아야 나라를 지킬 수 있다는 것이다."
 jfp_gaehwa.10.f:0 "등잔 밑에서 사전을 뒤적이던 역관이 한숨을 쉬었다. “이 ‘리버티’라는 말을 무엇이라 옮겨야 할지….”"
 jfp_gaehwa.10.a:0 "번역 사업을 지원하라."
 jfp_gaehwa.10.b:0 "성현의 글이면 충분하다."

 jfp_gaehwa.11.t:0 "도끼를 메고 올린 상소"
 jfp_gaehwa.11.d:0 "한 유학자가 도끼를 메고 궐문 앞에 엎드려 상소를 올렸다. 개화 정책을 철회하지 않으려면 차라리 그 도끼로 자신의 목을 치라는 것이다."
 jfp_gaehwa.11.f:0 "흰 도포 자락이 바람에 날렸다. 노학자는 미동도 없이 엎드려 있었고, 그 앞에 놓인 도끼날이 햇빛에 번득였다."
 jfp_gaehwa.11.a:0 "그의 충정을 받아들인다."
 jfp_gaehwa.11.b:0 "충정은 알겠으나 정책은 바꾸지 않는다."

 jfp_gaehwa.12.t:0 "개항장의 상인들"
 jfp_gaehwa.12.d:0 "개항장을 중심으로 외국 상인들이 내륙까지 진출하면서 보부상과 객주들의 상권이 위협받고 있다. 이들은 조정에 보호를 요청하고 있다."
 jfp_gaehwa.12.f:0 "“서양 옥양목 한 필 값이면 우리 무명 세 필이오. 이래서야 누가 우리 물건을 사겠소.”"
 jfp_gaehwa.12.a:0 "우리 상인의 상권을 보호하라."
 jfp_gaehwa.12.b:0 "자유로운 거래가 나라를 부유하게 한다."

 jfp_gaehwa.20.t:0 "자주 개화"
 jfp_gaehwa.20.d:0 "숱한 반발과 정변을 거쳤지만, 마침내 근대 국가로 나아갈 기틀이 마련되었다. 근대적 관청과 학교, 군대와 공장이 자리를 잡아 가고 있다."
 jfp_gaehwa.20.f:0 "기적 소리가 울렸다. 갓을 쓴 노인과 단발한 청년이 나란히 플랫폼에 서서, 처음 보는 쇠수레가 다가오는 것을 바라보았다."
 jfp_gaehwa.20.a:0 "우리 손으로 이룬 개화다."

 jfp_gaehwa.21.t:0 "국권의 위기"
 jfp_gaehwa.21.d:0 "우리는 자주권을 잃고 다른 나라의 간섭 아래 놓이게 되었다. 개화를 통해 나라를 지키려던 꿈은 좌절되었다."
 jfp_gaehwa.21.f:0 "종로 거리에 붙은 방(榜) 앞에서 사람들이 발길을 멈추었다. 글을 아는 이가 소리 내어 읽자, 군중 속에서 누군가 주먹으로 가슴을 쳤다."
 jfp_gaehwa.21.a:0 "아직 끝난 것이 아니다."

 # ─────────────── 광무개혁 ───────────────
 jfp_gwangmu.1.t:0 "구본신참"
 jfp_gwangmu.1.d:0 "환구단에서 하늘에 제사를 올리고 황제에 즉위한 지금, 그 이름에 걸맞은 나라를 만들어야 한다. 옛 법을 근본으로 삼되 새로운 제도를 참작하여 토지, 군사, 산업, 금융 전반의 개혁에 나선다."
 jfp_gwangmu.1.f:0 "황금색 곤룡포를 입은 황제가 환구단 계단을 올랐다. 그 아래 도열한 백관들 가운데 몇은 감격에 겨워 눈시울을 붉혔고, 몇은 열강 공사관 쪽을 흘끔거렸다."
 jfp_gwangmu.1.a:0 "광무의 시대를 열자."

 jfp_gwangmu.2.t:0 "종로의 연설"
 jfp_gwangmu.2.d:0 "독립협회가 종로에서 만민공동회를 열고 있다. 백정부터 양반까지 수천 명이 모여 열강의 이권 침탈을 규탄하고 의회 설립을 요구한다. 황실 측근들은 이들이 황제를 몰아내고 공화정을 세우려 한다고 모함한다."
 jfp_gwangmu.2.f:0 "연단에 오른 백정 출신 사내가 떨리는 목소리로 입을 열었다. “나는 대한에서 가장 천한 사람이오. 그러나 나라를 사랑하는 마음은 대신들과 다를 바 없소.”\n\n광장이 박수 소리로 떠나갈 듯했다."
 jfp_gwangmu.2.a:0 "백성의 목소리를 듣겠다."
 jfp_gwangmu.2.b:0 "황국협회를 동원해 해산시켜라."

 jfp_gwangmu.3.t:0 "대한국 국제"
 jfp_gwangmu.3.d:0 "대한제국이 자주독립한 제국이며, 황제가 군통수권·입법권·사법권·외교권 등 무한한 군권을 지닌다고 명시한 국가 기본법의 초안이 올라왔다. 개혁 세력은 민권에 관한 조항이 하나도 없다며 우려한다."
 jfp_gwangmu.3.f:0 "“제1조, 대한국은 세계 만국이 공인한 자주독립하는 제국이다.”\n\n낭독하는 신하의 목소리가 떨렸다. 제2조부터는 온통 황제의 권한에 관한 것이었다."
 jfp_gwangmu.3.a:0 "반포하라. 황권이 바로 서야 나라가 선다."
 jfp_gwangmu.3.b:0 "입헌에 관한 논의도 허락하겠다."

 jfp_gwangmu.4.t:0 "쇠로 된 수레"
 jfp_gwangmu.4.d:0 "서울에 전차가 개통되었다. 사람들은 신기해하며 몰려들었지만, 개통 직후 전차에 아이가 치여 숨지는 사고가 나자 성난 군중이 전차를 불태웠다."
 jfp_gwangmu.4.f:0 "동대문 앞 정거장에는 전차를 한번 타 보려는 사람들로 장사진이 쳐졌다. 시골에서 올라온 노인 하나는 전차를 타고 종로와 동대문 사이를 하루 종일 오갔다고 한다."
 jfp_gwangmu.4.a:0 "운행을 계속한다. 사고 대책은 세우겠다."
 jfp_gwangmu.4.b:0 "민심이 가라앉을 때까지 운행을 멈춰라."

 jfp_gwangmu.5.t:0 "이권의 대가"
 jfp_gwangmu.5.d:0 "열강의 공사관이 앞다투어 광산 채굴권과 산림 벌채권, 철도 부설권을 요구하고 있다. 내주면 당장 막대한 대가를 받을 수 있지만, 나라의 자원이 외국 손에 넘어간다."
 jfp_gwangmu.5.f:0 "외국 공사는 계약서를 탁자 위로 밀며 웃었다. “서명만 하시면 됩니다. 나머지는 저희가 알아서 하지요.”"
 jfp_gwangmu.5.a:0 "이권을 내주고 대가를 받아라."
 jfp_gwangmu.5.b:0 "우리 땅의 자원은 우리가 개발한다."

 jfp_gwangmu.10.t:0 "광무의 결실"
 jfp_gwangmu.10.d:0 "광무개혁이 결실을 맺었다. 토지 제도가 정비되고 군대가 근대화되었으며, 서울에는 전기와 철도가 들어섰다. 대한제국은 이제 열강도 함부로 할 수 없는 나라가 되어 가고 있다."
 jfp_gwangmu.10.f:0 "만국박람회의 대한제국관 앞에 외국인 관람객들이 줄을 섰다. 전시된 물품 가운데에는 국내에서 만든 기계와 직물도 있었다."
 jfp_gwangmu.10.a:0 "대한 사람 대한으로 길이 보전하세."

 jfp_gwangmu.11.t:0 "꺾인 개혁"
 jfp_gwangmu.11.d:0 "대한제국은 외국의 간섭 아래 놓이게 되었다. 광무개혁은 미완으로 끝났다."
 jfp_gwangmu.11.f:0 "덕수궁 중명전의 문이 닫혔다. 그 안에서 무슨 일이 있었는지, 백성들은 며칠 뒤 신문을 통해서야 알 수 있었다."
 jfp_gwangmu.11.a:0 "황제는 아직 포기하지 않았다."
