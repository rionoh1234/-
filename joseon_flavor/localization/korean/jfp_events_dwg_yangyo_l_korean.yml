l_korean:
 # ─────────────── 흥선대원군 ───────────────
 jfp_dwg.1.t:0 "대원위 대감"
 jfp_dwg.1.d:0 "임금이 후사 없이 승하하자, 왕실의 어른 조대비는 흥선군 이하응의 둘째 아들을 새 임금으로 지명했다. 열두 살 어린 임금을 대신해 그 생부인 흥선대원군이 국정의 전면에 나섰다. 그는 오랫동안 세도가의 눈을 피해 파락호 행세를 하며 때를 기다려 온 인물이다."
 jfp_dwg.1.f:0 "“천 리를 끌어다 지척으로 삼고, 태산을 깎아 평지로 만들며, 남대문을 높여 삼층으로 하겠다.”\n\n세도가 대감들은 그 말을 농담으로 들었다. 그것이 실수였다."
 jfp_dwg.1.a:0 "대원군께 국정을 맡긴다."
 jfp_dwg.1.b:0 "왕실의 어른으로 예우하되 실권은 드리지 않는다."

 jfp_dwg.2.t:0 "원해서 바치는 돈"
 jfp_dwg.2.d:0 "궁궐 공사와 국방 비용을 마련하기 위해 백성과 관리, 부호들에게 ‘스스로 원해서 바치는’ 원납전을 걷고 있다. 그러나 실상은 강제나 다름없어 원성이 높다."
 jfp_dwg.2.f:0 "“원납전이라더니, 원망하며 납부하는 돈이라 원납전이로구먼.”"
 jfp_dwg.2.a:0 "나라를 위한 일이다. 계속 거두어라."
 jfp_dwg.2.b:0 "원성이 너무 크다. 중단하라."

 jfp_dwg.3.t:0 "궐문 앞의 유생들"
 jfp_dwg.3.d:0 "서원 철폐에 반대하는 유생 수백 명이 궐문 앞에 엎드려 복합상소를 올리고 있다. 이들은 선현을 모신 서원을 없애는 것은 유학 자체를 모욕하는 일이라 주장한다."
 jfp_dwg.3.f:0 "“백성을 해치는 자는 비록 공자가 다시 살아난다 해도 내가 용서하지 않을 것이다. 하물며 서원은 우리나라 선유(先儒)를 제사하는 곳인데 어찌 도둑의 소굴이 되었느냐.”"
 jfp_dwg.3.a:0 "포졸을 풀어 한강 너머로 몰아내라."
 jfp_dwg.3.b:0 "몇몇 서원은 복원을 허락하겠다."

 jfp_dwg.4.t:0 "공사장의 불"
 jfp_dwg.4.d:0 "경복궁 공사장에 큰불이 나 쌓아 둔 목재와 가건물이 잿더미가 되었다. 지금까지 들인 공력의 상당 부분이 사라졌다."
 jfp_dwg.4.f:0 "밤하늘을 붉게 물들인 불길을 바라보며, 동원된 역부 하나가 중얼거렸다. “하늘도 이 공사를 싫어하는가 보오.”"
 jfp_dwg.4.a:0 "다시 짓는다. 공사를 멈추지 마라."
 jfp_dwg.4.b:0 "백성의 고통이 크니 공사의 규모를 줄여라."

 jfp_dwg.5.t:0 "산포수"
 jfp_dwg.5.d:0 "서양 함선의 출몰에 대비해, 호랑이를 사냥하던 함경도와 평안도의 산포수들을 군에 편입하자는 건의가 올라왔다. 이들의 사격 솜씨는 정규군을 훨씬 능가한다."
 jfp_dwg.5.f:0 "“범을 잡는 총이면 양이(洋夷)도 잡지 못할 리 있겠소.”"
 jfp_dwg.5.a:0 "포수들을 모집하라."
 jfp_dwg.5.b:0 "그들은 고향에서 생업을 잇게 하라."

 jfp_dwg.10.t:0 "개혁의 완수"
 jfp_dwg.10.d:0 "흥선대원군의 개혁이 결실을 맺었다. 세도가의 기반은 무너졌고, 국가 재정과 군비는 이전보다 튼튼해졌다. 많은 이들이 그를 원망하지만, 나라의 기강이 다시 섰다는 것은 누구도 부정하지 못한다."
 jfp_dwg.10.f:0 "운현궁 사랑채에 앉은 대원군은 지팡이를 짚고 창밖을 내다보았다. “이제 겨우 집의 기둥을 세웠을 뿐이다.”"
 jfp_dwg.10.a:0 "나라의 기틀이 다시 섰다."

 jfp_dwg.11.t:0 "대원군의 하야"
 jfp_dwg.11.d:0 "장성한 임금이 친정을 선언했다. 대원군의 실정을 비판하는 상소가 받아들여지면서, 십 년 동안 국정을 움켜쥐었던 대원군은 운현궁으로 물러났다. 이제 왕비의 친족들이 조정에 들어서기 시작한다."
 jfp_dwg.11.f:0 "“나라의 일은 이제 과인이 맡겠습니다. 아버님께서는 편히 쉬소서.”\n\n대원군은 대답 없이 돌아섰다. 그의 뒷모습을 지켜보던 이들은 이것이 끝이 아님을 직감했다."
 jfp_dwg.11.a:0 "유림의 뜻을 받들어 친정을 시작한다."
 jfp_dwg.11.b:0 "왕비의 친족에게 요직을 맡긴다."

 # ─────────────── 양요 ───────────────
 jfp_yangyo.1.t:0 "대동강의 이양선"
 jfp_yangyo.1.d:0 "무장한 서양 상선 한 척이 대동강을 거슬러 평양까지 올라와 통상을 요구하고 있다. 선원들은 관리를 억류하고 민가를 약탈했으며, 강물이 줄어 배는 모래톱에 걸려 꼼짝 못 하는 처지다."
 jfp_yangyo.1.f:0 "강가에 모인 군민들이 화공(火攻)을 준비했다. 땔나무를 실은 작은 배들이 불을 붙인 채 물살을 타고 검은 배를 향해 흘러갔다."
 jfp_yangyo.1.a:0 "배를 불태우고 침입자들을 처단하라."
 jfp_yangyo.1.b:0 "식량을 주어 돌려보내라."

 jfp_yangyo.2.t:0 "강화도의 프랑스 함대"
 jfp_yangyo.2.d:0 "신부들의 처형을 구실로 프랑스 함대가 강화도를 점령했다. 그들은 강화부를 약탈하고 외규장각에 보관된 의궤와 서적을 빼앗아 가려 한다. 조정은 결단을 내려야 한다."
 jfp_yangyo.2.f:0 "정족산성 위에서 매복한 포수들이 숨을 죽였다. 산 아래로 총검을 꽂은 서양 병사들이 대열을 지어 올라오고 있었다."
 jfp_yangyo.2.a:0 "정족산성을 사수하고 적을 물리쳐라!"
 jfp_yangyo.2.b:0 "협상하여 철수를 요청하라."

 jfp_yangyo.3.t:0 "남연군 묘의 도굴꾼"
 jfp_yangyo.3.d:0 "통상을 거절당한 서양 상인 무리가 충청도 덕산에 상륙하여, 대원군의 부친 남연군의 묘를 파헤치려다 실패하고 달아났다. 유해를 볼모로 통상을 강요하려 했다는 것이다."
 jfp_yangyo.3.f:0 "“조상의 무덤을 파헤치는 자들과 무슨 통상을 논한단 말이냐!”\n\n소식을 들은 대원군의 노성이 운현궁 담장을 넘었다."
 jfp_yangyo.3.a:0 "이런 오랑캐와는 결코 화친할 수 없다!"
 jfp_yangyo.3.b:0 "분노는 크나, 일부 무뢰배의 짓일 뿐이다."

 jfp_yangyo.4.t:0 "광성보"
 jfp_yangyo.4.d:0 "대동강 사건의 책임을 묻는다며 미국 함대가 강화도 해협에 나타났다. 그들은 초지진과 덕진진을 차례로 점령하고 광성보로 몰려오고 있다. 진무중군 어재연이 결사항전을 다짐하고 있다."
 jfp_yangyo.4.f:0 "탄환이 떨어지자 병사들은 돌을 던졌고, 돌이 떨어지자 흙을 뿌렸다. 수자기(帥字旗) 아래에서 마지막 한 사람까지 물러서지 않았다."
 jfp_yangyo.4.a:0 "한 걸음도 물러서지 마라!"
 jfp_yangyo.4.b:0 "싸움을 멈추고 수교를 논하자."

 jfp_yangyo.9.t:0 "이양선이 떠난 뒤"
 jfp_yangyo.9.d:0 "서양 함대들이 물러갔다. 조정은 이번 일로 나라의 문을 어떻게 지킬지, 혹은 어떻게 열지에 대한 답을 얻었다."
 jfp_yangyo.9.f:0 "강화 해협의 물결은 다시 잔잔해졌다. 그러나 수평선 너머에서 다음 배가 오리라는 것을, 바닷가 사람들은 알고 있었다."
 jfp_yangyo.9.a:0 "양이는 결코 이 땅을 넘보지 못한다."
 jfp_yangyo.9.b:0 "열린 문으로 무엇이 들어올지는 우리 하기에 달렸다."
